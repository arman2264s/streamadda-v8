name: "StreamAdda v8 – GitHub Actions Streaming Engine"

# ============================================================
# TRIGGERS
# 1. repository_dispatch  →  fired by the Netlify frontend
# 2. workflow_dispatch    →  manual run from the Actions tab
# ============================================================
on:
  repository_dispatch:
    types: [start-stream]

  workflow_dispatch:
    inputs:
      stream_name:
        description: "Stream display name"
        required: false
        default: "Live Stream"
        type: string
      stream_key:
        description: "RTMP Stream Key (YouTube or Facebook)"
        required: true
        type: string
      ratio:
        description: "Video ratio — 9:16 (portrait/Shorts) or 16:9 (landscape)"
        required: false
        default: "9:16"
        type: choice
        options:
          - "9:16"
          - "16:9"
      total_minutes:
        description: "Total stream duration in minutes (minimum 2)"
        required: false
        default: "60"
        type: string
      platform:
        description: "Streaming platform target"
        required: false
        default: "youtube"
        type: choice
        options:
          - youtube
          - facebook
      backup_rtmp:
        description: "Backup RTMP full URL including key (optional)"
        required: false
        default: ""
        type: string
      youtube_video_id:
        description: "YouTube Video ID for monitoring (optional)"
        required: false
        default: ""
        type: string
      start_at:
        description: "Scheduled start (ISO 8601, e.g. 2024-06-01T14:30:00Z) — leave blank for immediate"
        required: false
        default: ""
        type: string
      stop_at:
        description: "Hard stop time (ISO 8601) — overrides total_minutes if earlier"
        required: false
        default: ""
        type: string

jobs:
  stream:
    name: "FFmpeg Live Stream Engine"
    runs-on: ubuntu-latest
    # 6-hour GitHub Actions hard cap — covers the 5-6 h/day use case
    timeout-minutes: 360

    steps:

      # ----------------------------------------------------------
      # STEP 1 — Checkout the repository
      # live_photo.jpg and live_video.mp4 must exist in repo root
      # ----------------------------------------------------------
      - name: "[1/8] Checkout repository"
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # STEP 2 — Extract and validate every parameter
      # Supports both repository_dispatch (client_payload) and
      # workflow_dispatch (inputs) trigger sources.
      # ----------------------------------------------------------
      - name: "[2/8] Extract and validate parameters"
        id: params
        shell: bash
        run: |
          # ---- Pick values from the correct trigger source ----
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RAW_NAME="${{ github.event.client_payload.stream_name }}"
            RAW_KEY="${{ github.event.client_payload.stream_key }}"
            RAW_RATIO="${{ github.event.client_payload.ratio }}"
            RAW_MINUTES="${{ github.event.client_payload.total_minutes }}"
            RAW_PLATFORM="${{ github.event.client_payload.platform }}"
            RAW_BACKUP="${{ github.event.client_payload.backup_rtmp }}"
            RAW_YTID="${{ github.event.client_payload.youtube_video_id }}"
            RAW_START_AT="${{ github.event.client_payload.start_at }}"
            RAW_STOP_AT="${{ github.event.client_payload.stop_at }}"
          else
            RAW_NAME="${{ github.event.inputs.stream_name }}"
            RAW_KEY="${{ github.event.inputs.stream_key }}"
            RAW_RATIO="${{ github.event.inputs.ratio }}"
            RAW_MINUTES="${{ github.event.inputs.total_minutes }}"
            RAW_PLATFORM="${{ github.event.inputs.platform }}"
            RAW_BACKUP="${{ github.event.inputs.backup_rtmp }}"
            RAW_YTID="${{ github.event.inputs.youtube_video_id }}"
            RAW_START_AT="${{ github.event.inputs.start_at }}"
            RAW_STOP_AT="${{ github.event.inputs.stop_at }}"
          fi

          # ---- Apply defaults ----
          STREAM_NAME="${RAW_NAME:-Live Stream}"
          RATIO="${RAW_RATIO:-9:16}"
          TOTAL_MINUTES="${RAW_MINUTES:-60}"
          PLATFORM="${RAW_PLATFORM:-youtube}"
          BACKUP_RTMP="${RAW_BACKUP:-}"
          YOUTUBE_VIDEO_ID="${RAW_YTID:-}"
          START_AT="${RAW_START_AT:-}"
          STOP_AT="${RAW_STOP_AT:-}"
          STREAM_KEY="${RAW_KEY:-}"

          # ---- Validate stream key (required) ----
          if [ -z "$STREAM_KEY" ]; then
            echo "" >&2
            echo "❌ [SA] FATAL: stream_key is empty." >&2
            echo "   You must supply the RTMP stream key from YouTube Studio or Facebook Live Producer." >&2
            exit 1
          fi

          # ---- Validate ratio ----
          if [ "$RATIO" != "16:9" ] && [ "$RATIO" != "9:16" ]; then
            echo "⚠️  [SA] Invalid ratio '${RATIO}'. Defaulting to 9:16."
            RATIO="9:16"
          fi

          # ---- Validate total_minutes ----
          if ! echo "$TOTAL_MINUTES" | grep -qE '^[0-9]+$' || [ "$TOTAL_MINUTES" -lt 2 ]; then
            echo "⚠️  [SA] Invalid total_minutes '${TOTAL_MINUTES}'. Defaulting to 60."
            TOTAL_MINUTES=60
          fi

          # ---- Validate and set platform + RTMP base URL ----
          if [ "$PLATFORM" = "facebook" ]; then
            RTMP_BASE="rtmps://live-api-s.facebook.com:443/rtmp/"
            PLATFORM_LABEL="Facebook Live"
          else
            PLATFORM="youtube"
            RTMP_BASE="rtmps://a.rtmp.youtube.com/live2/"
            PLATFORM_LABEL="YouTube Live"
          fi
          RTMP_URL="${RTMP_BASE}${STREAM_KEY}"

          # ---- Set canvas dimensions from ratio ----
          if [ "$RATIO" = "16:9" ]; then
            WIDTH=1280
            HEIGHT=720
          else
            WIDTH=720
            HEIGHT=1280
          fi

          # ---- Export all outputs for downstream steps ----
          echo "stream_name=${STREAM_NAME}"     >> "$GITHUB_OUTPUT"
          echo "stream_key=${STREAM_KEY}"       >> "$GITHUB_OUTPUT"
          echo "ratio=${RATIO}"                 >> "$GITHUB_OUTPUT"
          echo "total_minutes=${TOTAL_MINUTES}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM}"           >> "$GITHUB_OUTPUT"
          echo "platform_label=${PLATFORM_LABEL}" >> "$GITHUB_OUTPUT"
          echo "backup_rtmp=${BACKUP_RTMP}"     >> "$GITHUB_OUTPUT"
          echo "youtube_video_id=${YOUTUBE_VIDEO_ID}" >> "$GITHUB_OUTPUT"
          echo "start_at=${START_AT}"           >> "$GITHUB_OUTPUT"
          echo "stop_at=${STOP_AT}"             >> "$GITHUB_OUTPUT"
          echo "rtmp_url=${RTMP_URL}"           >> "$GITHUB_OUTPUT"
          echo "rtmp_base=${RTMP_BASE}"         >> "$GITHUB_OUTPUT"
          echo "width=${WIDTH}"                 >> "$GITHUB_OUTPUT"
          echo "height=${HEIGHT}"               >> "$GITHUB_OUTPUT"

          # ---- Print configuration banner ----
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║        StreamAdda v8 - GitHub Actions Engine        ║"
          echo "╚══════════════════════════════════════════════╝"
          printf "  Stream Name    : %s\n"  "$STREAM_NAME"
          printf "  Platform       : %s\n"  "$PLATFORM_LABEL"
          printf "  Ratio          : %s (%sx%s)\n" "$RATIO" "$WIDTH" "$HEIGHT"
          printf "  Total Duration : %s minutes\n" "$TOTAL_MINUTES"
          printf "  RTMP Target    : %s****\n" "$RTMP_BASE"
          if [ -n "$BACKUP_RTMP" ]; then
            printf "  Backup RTMP    : Configured\n"
          else
            printf "  Backup RTMP    : None\n"
          fi
          if [ -n "$YOUTUBE_VIDEO_ID" ]; then
            printf "  YouTube Vid ID : %s\n" "$YOUTUBE_VIDEO_ID"
          fi
          if [ -n "$START_AT" ]; then
            printf "  Sched. Start   : %s\n" "$START_AT"
          else
            printf "  Sched. Start   : Immediate\n"
          fi
          if [ -n "$STOP_AT" ]; then
            printf "  Hard Stop At   : %s\n" "$STOP_AT"
          fi
          echo ""

      # ----------------------------------------------------------
      # STEP 3 — Install FFmpeg with all required codec libraries
      # ----------------------------------------------------------
      - name: "[3/8] Install FFmpeg and system dependencies"
        shell: bash
        run: |
          echo "📦 [SA] Updating apt package lists..."
          sudo apt-get update -qq

          echo "📦 [SA] Installing FFmpeg and required libraries..."
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libavcodec-extra \
            libopus0 \
            libvorbis0a \
            libvpx7 \
            libfdk-aac2 \
            libmp3lame0 \
            libx264-163 \
            libx265-199 \
            libass9 \
            libfreetype6 \
            libssl3 \
            python3 \
            python3-pip \
            jq \
            curl \
            procps \
            coreutils

          echo ""
          echo "✅ [SA] FFmpeg installation complete."
          echo "🔍 [SA] Verifying FFmpeg binary:"
          ffmpeg -version 2>&1 | head -6
          echo ""
          echo "🔍 [SA] Verifying ffprobe binary:"
          ffprobe -version 2>&1 | head -3
          echo ""
          echo "✅ [SA] All required codec libraries confirmed ready."

      # ----------------------------------------------------------
      # STEP 4 — Verify that live_photo.jpg and live_video.mp4
      #          exist in the repository root before doing anything
      # ----------------------------------------------------------
      - name: "[4/8] Verify source media files in repository root"
        shell: bash
        run: |
          echo "🔍 [SA] Checking for required source media files..."
          echo ""

          PHOTO_MISSING=false
          VIDEO_MISSING=false

          if [ ! -f "live_photo.jpg" ]; then
            echo "❌ [SA] live_photo.jpg — NOT FOUND in repository root!"
            PHOTO_MISSING=true
          else
            PHOTO_SIZE=$(du -h live_photo.jpg | awk '{print $1}')
            echo "✅ [SA] live_photo.jpg — Found. Size: ${PHOTO_SIZE}"
          fi

          if [ ! -f "live_video.mp4" ]; then
            echo "❌ [SA] live_video.mp4 — NOT FOUND in repository root!"
            VIDEO_MISSING=true
          else
            VIDEO_SIZE=$(du -h live_video.mp4 | awk '{print $1}')
            echo "✅ [SA] live_video.mp4 — Found. Size: ${VIDEO_SIZE}"
          fi

          if [ "$PHOTO_MISSING" = "true" ] || [ "$VIDEO_MISSING" = "true" ]; then
            echo ""
            echo "❌ [SA] FATAL: Required media files are missing from the repository root." >&2
            echo "   • Commit 'live_photo.jpg' as your cover/thumbnail image." >&2
            echo "   • Commit 'live_video.mp4' as the video that plays at stream end." >&2
            echo "   Both files MUST exist in the root of your GitHub repository." >&2
            exit 1
          fi

          echo ""
          echo "✅ [SA] All required source media files verified and ready."

      # ----------------------------------------------------------
      # STEP 5 — Probe the video file with ffprobe
      #   - Detect exact video duration
      #   - Detect if the video has an audio track
      #   - Calculate photo phase duration
      #   - Validate timing feasibility
      # ----------------------------------------------------------
      - name: "[5/8] Probe video and calculate stream timing plan"
        id: timing
        shell: bash
        run: |
          echo "🎬 [SA] Probing live_video.mp4 with ffprobe..."
          echo ""

          # ---- Get video duration (floating-point seconds) ----
          VIDEO_DUR_RAW=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            live_video.mp4 2>/dev/null)

          if [ -z "$VIDEO_DUR_RAW" ] || [ "$VIDEO_DUR_RAW" = "N/A" ]; then
            echo "❌ [SA] FATAL: ffprobe could not determine video duration." >&2
            echo "   Ensure live_video.mp4 is a valid, playable video file." >&2
            exit 1
          fi

          # ---- Check for audio stream ----
          HAS_AUDIO_RAW=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            live_video.mp4 2>/dev/null)

          if [ -n "$HAS_AUDIO_RAW" ]; then
            HAS_AUDIO="true"
          else
            HAS_AUDIO="false"
          fi

          # ---- Use Python for precise arithmetic ----
          TOTAL_MINUTES="${{ steps.params.outputs.total_minutes }}"

          python3 - <<PYEOF
import sys, math

try:
    video_dur = float("${VIDEO_DUR_RAW}".strip())
except ValueError:
    print("[SA] FATAL: Could not parse video duration.", file=sys.stderr)
    sys.exit(1)

total_minutes = int("${TOTAL_MINUTES}")
total_seconds = total_minutes * 60
video_dur_int = int(video_dur)
photo_dur     = total_seconds - video_dur_int

print(f"  Video duration (raw) : {video_dur:.3f} seconds")
print(f"  Video duration (int) : {video_dur_int} seconds")
print(f"  Total duration       : {total_seconds} seconds ({total_minutes}m)")
print(f"  Photo phase duration : {photo_dur} seconds")

if video_dur <= 0:
    print("[SA] FATAL: Video duration is zero or negative.", file=sys.stderr)
    sys.exit(1)

if photo_dur <= 10:
    needed = video_dur_int + 11
    print("", file=sys.stderr)
    print(f"[SA] FATAL: video ({video_dur:.1f}s) is too long for {total_seconds}s total.", file=sys.stderr)
    print(f"   Increase total_minutes to at least {math.ceil(needed/60)} minutes, or use a shorter video.", file=sys.stderr)
    sys.exit(1)

print()
print(f"  PLAN: Photo {photo_dur}s  +  Video {video_dur_int}s  =  Total {total_seconds}s")
PYEOF

          # ---- Re-compute in bash for GITHUB_OUTPUT ----
          VIDEO_DUR_INT=$(python3 -c "print(int(float('${VIDEO_DUR_RAW}'.strip())))")
          TOTAL_SECONDS=$(( TOTAL_MINUTES * 60 ))
          PHOTO_DUR=$(( TOTAL_SECONDS - VIDEO_DUR_INT ))
          # Noise source for video-phase audio (+ 2s buffer so lavfi does not end early)
          VIDEO_DUR_NOISE=$(( VIDEO_DUR_INT + 2 ))

          echo ""
          echo "┌────────────────────────────────────────────┐"
          echo "│             TIMING PLAN CONFIRMED             │"
          echo "├────────────────────────────────────────────┤"
          printf "│  📸 Photo phase : %-26s │\n" "${PHOTO_DUR}s"
          printf "│  🎬 Video phase : %-26s │\n" "${VIDEO_DUR_INT}s"
          printf "│  ⏱️  Total       : %-26s │\n" "${TOTAL_SECONDS}s (${TOTAL_MINUTES}m)"
          printf "│  🔊 Video audio : %-26s │\n" "${HAS_AUDIO}"
          echo "└────────────────────────────────────────────┘"

          # ---- Write to GITHUB_OUTPUT ----
          echo "video_dur=${VIDEO_DUR_RAW}"           >> "$GITHUB_OUTPUT"
          echo "video_dur_int=${VIDEO_DUR_INT}"       >> "$GITHUB_OUTPUT"
          echo "video_dur_noise=${VIDEO_DUR_NOISE}"   >> "$GITHUB_OUTPUT"
          echo "photo_dur=${PHOTO_DUR}"               >> "$GITHUB_OUTPUT"
          echo "total_seconds=${TOTAL_SECONDS}"       >> "$GITHUB_OUTPUT"
          echo "has_audio=${HAS_AUDIO}"               >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # STEP 6 — Handle scheduled start time
      # If start_at is set and is in the future, sleep until then.
      # ----------------------------------------------------------
      - name: "[6/8] Handle scheduled start time"
        shell: bash
        run: |
          START_AT="${{ steps.params.outputs.start_at }}"

          if [ -z "$START_AT" ]; then
            echo "⏰ [SA] No scheduled start time — launching stream immediately."
            exit 0
          fi

          echo "⏰ [SA] Scheduled start time configured: ${START_AT}"

          DELAY=$(python3 - <<PYEOF
import datetime, sys

start_at = "${START_AT}".strip()
if not start_at:
    print(0)
    sys.exit(0)

try:
    if start_at.endswith('Z'):
        start_at = start_at[:-1] + '+00:00'
    target = datetime.datetime.fromisoformat(start_at)
    if target.tzinfo is None:
        target = target.replace(tzinfo=datetime.timezone.utc)
    now    = datetime.datetime.now(datetime.timezone.utc)
    delay  = (target - now).total_seconds()
    print(max(0, int(delay)))
except Exception as exc:
    print(f"[SA][WARN] Could not parse start_at: {exc}", file=sys.stderr)
    print(0)
PYEOF
)

          if [ "$DELAY" -gt 0 ]; then
            # Cap to a safe max to avoid GitHub Actions timeout eating into stream time
            MAX_WAIT=18000  # 5 hours
            if [ "$DELAY" -gt "$MAX_WAIT" ]; then
              echo "⚠️  [SA] Requested wait (${DELAY}s) exceeds 5h safety cap. Capping at ${MAX_WAIT}s."
              DELAY="$MAX_WAIT"
            fi
            HOURS=$(( DELAY / 3600 ))
            MINS=$(( (DELAY % 3600) / 60 ))
            SECS=$(( DELAY % 60 ))
            echo "⏰ [SA] Waiting ${HOURS}h ${MINS}m ${SECS}s until scheduled start..."
            sleep "$DELAY"
            echo "✅ [SA] Scheduled start time reached. Proceeding."
          else
            echo "✅ [SA] Scheduled start time is in the past — starting immediately."
          fi

      # ----------------------------------------------------------
      # STEP 7 — THE HEART OF V8: Single-session FFmpeg stream
      #
      # ONE continuous FFmpeg process that:
      #   Segment 1: looped photo + faint noise floor for photo_dur seconds
      #   Segment 2: the video file + its audio (or noise if no audio), once
      # Concatenated by a single filter_complex and pushed over ONE
      # never-broken RTMP connection.
      #
      # This is the exact port of build_single_session_cmd() from app.py.
      # A hard-deadline watchdog (GNU timeout) acts as the _watchdog() from
      # app.py: it kills FFmpeg EXACTLY when total_minutes elapses (or
      # stop_at is reached, whichever comes first).
      # ----------------------------------------------------------
      - name: "[7/8] Launch single-session FFmpeg stream (photo+video concat)"
        id: ffmpeg_stream
        shell: bash
        run: |
          # ---- Load step outputs ----
          RTMP_URL="${{ steps.params.outputs.rtmp_url }}"
          RTMP_BASE="${{ steps.params.outputs.rtmp_base }}"
          BACKUP_RTMP="${{ steps.params.outputs.backup_rtmp }}"
          WIDTH="${{ steps.params.outputs.width }}"
          HEIGHT="${{ steps.params.outputs.height }}"
          RATIO="${{ steps.params.outputs.ratio }}"
          PLATFORM="${{ steps.params.outputs.platform }}"
          TOTAL_MINUTES="${{ steps.params.outputs.total_minutes }}"
          STOP_AT="${{ steps.params.outputs.stop_at }}"
          PHOTO_DUR="${{ steps.timing.outputs.photo_dur }}"
          VIDEO_DUR_INT="${{ steps.timing.outputs.video_dur_int }}"
          VIDEO_DUR_NOISE="${{ steps.timing.outputs.video_dur_noise }}"
          TOTAL_SECONDS="${{ steps.timing.outputs.total_seconds }}"
          HAS_AUDIO="${{ steps.timing.outputs.has_audio }}"

          # ---- The exact QUIET_NOISE constant from app.py ----
          # ~-60 dB, completely inaudible — keeps the AAC encoder producing
          # a steady ~128 kbps audio track so YouTube never logs
          # "audio stream's current bitrate (0) is lower than recommended 128 kbps"
          QUIET_NOISE="anoisesrc=r=44100:amplitude=0.001:color=white"

          # ---- Build filter_complex (exact port of filter graph from app.py) ----
          #
          # _vfilter(): scale to canvas, preserve aspect ratio, pad black, 30fps, yuv420p
          VFILTER_PHOTO="[0:v]scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=30,format=yuv420p[v0]"
          VFILTER_VIDEO="[2:v]scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=30,format=yuv420p[v1]"

          # _afilter(): normalise to 44100Hz / stereo / fltp
          # This kills the AAC frequency warning and allows concat to join
          # photo-noise + video-audio without sample rate mismatches.
          AFILTER_PHOTO="[1:a]aresample=async=1:first_pts=0,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100[a0]"

          # ---- Calculate the hard-deadline watchdog timeout ----
          # + 8 seconds grace period (mirrors the '+8' in the _watchdog() coroutine)
          TIMEOUT_SECONDS=$(( TOTAL_SECONDS + 8 ))

          # If stop_at is set and earlier, use it instead
          if [ -n "$STOP_AT" ]; then
            STOP_AT_SECS=$(python3 - <<PYEOF
import datetime, sys
try:
    s = "${STOP_AT}".strip()
    if s.endswith('Z'): s = s[:-1] + '+00:00'
    t = datetime.datetime.fromisoformat(s)
    if t.tzinfo is None: t = t.replace(tzinfo=datetime.timezone.utc)
    now = datetime.datetime.now(datetime.timezone.utc)
    rem = int((t - now).total_seconds())
    print(max(0, rem))
except Exception:
    print(-1)
PYEOF
)
            if [ "$STOP_AT_SECS" -gt 0 ] && [ "$STOP_AT_SECS" -lt "$TIMEOUT_SECONDS" ]; then
              echo "⏰ [SA] Hard stop_at deadline is earlier: ${STOP_AT_SECS}s from now."
              TIMEOUT_SECONDS="$STOP_AT_SECS"
            fi
          fi

          echo ""
          echo "🚀 [SA] ═════════════════════════════════════════════"
          echo "🚀 [SA]  LAUNCHING SINGLE CONTINUOUS FFMPEG SESSION"
          echo "🚀 [SA] ═════════════════════════════════════════════"
          echo "🚀 [SA]  Platform       : ${PLATFORM} | ${RATIO} | ${WIDTH}x${HEIGHT}"
          echo "🚀 [SA]  Photo Phase    : ${PHOTO_DUR}s"
          echo "🚀 [SA]  Video Phase    : ${VIDEO_DUR_INT}s (audio: ${HAS_AUDIO})"
          echo "🚀 [SA]  Watchdog Timer : ${TIMEOUT_SECONDS}s"
          echo "🚀 [SA]  RTMP           : ${RTMP_BASE}****"
          echo "🚀 [SA]  Mode           : ONE session. ONE connection. ZERO drops."
          echo "🚀 [SA] ═════════════════════════════════════════════"
          echo ""

          FFMPEG_EXIT=0

          if [ "$HAS_AUDIO" = "true" ]; then
            # ================================================================
            # CASE A: Video has its own audio track
            # Inputs:
            #   [0] = looped photo (rate-limited, -re, for photo_dur seconds)
            #   [1] = faint noise source for photo phase (inaudible -60 dB)
            #   [2] = video file (rate-limited, -re) with its own audio
            #
            # filter_complex:
            #   [0:v] -> scale+pad+fps+yuv420p -> [v0]
            #   [2:v] -> scale+pad+fps+yuv420p -> [v1]
            #   [1:a] -> resample 44100 stereo fltp -> [a0]  (photo noise)
            #   [2:a] -> resample 44100 stereo fltp -> [a1]  (video audio)
            #   [v0][a0][v1][a1] -> concat n=2:v=1:a=1 -> [vout][aout]
            # ================================================================
            FILTER_COMPLEX="${VFILTER_PHOTO};${VFILTER_VIDEO};${AFILTER_PHOTO};[2:a]aresample=async=1:first_pts=0,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[vout][aout]"

            timeout --kill-after=10s "${TIMEOUT_SECONDS}s" \
              ffmpeg \
                -hide_banner -y \
                -re -loop 1 -framerate 30 -t "${PHOTO_DUR}" -i live_photo.jpg \
                -f lavfi -t "${PHOTO_DUR}" -i "${QUIET_NOISE}" \
                -re -i live_video.mp4 \
                -filter_complex "${FILTER_COMPLEX}" \
                -map "[vout]" -map "[aout]" \
                -c:v libx264 \
                -preset veryfast \
                -tune zerolatency \
                -profile:v main \
                -level:v 4.0 \
                -b:v 2500k \
                -minrate 2500k \
                -maxrate 2500k \
                -bufsize 5000k \
                -pix_fmt yuv420p \
                -r 30 \
                -g 60 \
                -keyint_min 60 \
                -sc_threshold 0 \
                -x264opts no-scenecut \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -max_muxing_queue_size 1024 \
                -f flv \
                -flvflags no_duration_filesize \
                "${RTMP_URL}" \
              || FFMPEG_EXIT=$?
          else
            # ================================================================
            # CASE B: Video has NO audio track
            # An extra quiet noise source is injected for the video phase too
            # (mirrors the 'if not video_has_audio' branch in app.py).
            # Inputs:
            #   [0] = looped photo (rate-limited, -re, for photo_dur seconds)
            #   [1] = faint noise for photo phase
            #   [2] = video file (rate-limited, -re) — video-only, no audio
            #   [3] = faint noise for video phase (t = video_dur + 2s buffer)
            #
            # filter_complex:
            #   [0:v] -> scale+pad+fps+yuv420p -> [v0]
            #   [2:v] -> scale+pad+fps+yuv420p -> [v1]
            #   [1:a] -> resample 44100 stereo fltp -> [a0]  (photo noise)
            #   [3:a] -> resample 44100 stereo fltp -> [a1]  (video noise floor)
            #   [v0][a0][v1][a1] -> concat n=2:v=1:a=1 -> [vout][aout]
            # ================================================================
            FILTER_COMPLEX="${VFILTER_PHOTO};${VFILTER_VIDEO};${AFILTER_PHOTO};[3:a]aresample=async=1:first_pts=0,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[vout][aout]"

            timeout --kill-after=10s "${TIMEOUT_SECONDS}s" \
              ffmpeg \
                -hide_banner -y \
                -re -loop 1 -framerate 30 -t "${PHOTO_DUR}" -i live_photo.jpg \
                -f lavfi -t "${PHOTO_DUR}" -i "${QUIET_NOISE}" \
                -re -i live_video.mp4 \
                -f lavfi -t "${VIDEO_DUR_NOISE}" -i "${QUIET_NOISE}" \
                -filter_complex "${FILTER_COMPLEX}" \
                -map "[vout]" -map "[aout]" \
                -c:v libx264 \
                -preset veryfast \
                -tune zerolatency \
                -profile:v main \
                -level:v 4.0 \
                -b:v 2500k \
                -minrate 2500k \
                -maxrate 2500k \
                -bufsize 5000k \
                -pix_fmt yuv420p \
                -r 30 \
                -g 60 \
                -keyint_min 60 \
                -sc_threshold 0 \
                -x264opts no-scenecut \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -max_muxing_queue_size 1024 \
                -f flv \
                -flvflags no_duration_filesize \
                "${RTMP_URL}" \
              || FFMPEG_EXIT=$?
          fi

          echo ""
          if [ "$FFMPEG_EXIT" -eq 0 ]; then
            echo "✅ [SA] FFmpeg session finished cleanly (exit 0)."
          elif [ "$FFMPEG_EXIT" -eq 124 ]; then
            echo "⏱️  [SA] FFmpeg stopped by hard-deadline watchdog (SIGTERM after timeout)."
            echo "⏱️  [SA] This is the EXPECTED behaviour for a time-limited stream."
          elif [ "$FFMPEG_EXIT" -eq 137 ]; then
            echo "⚡ [SA] FFmpeg force-killed by watchdog (SIGKILL after SIGTERM grace)."
          else
            echo "⚠️  [SA] FFmpeg exited with code: ${FFMPEG_EXIT}"
          fi

          echo "ffmpeg_exit_code=${FFMPEG_EXIT}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # STEP 8 — Send the RTMP end-of-stream signal
      #
      # Exact port of ffmpeg_end_signal() from app.py:
      # 3-second pure-black video clip + inaudible noise floor
      # This forces RTMP deleteStream / FCUnpublish, which causes
      # YouTube Studio to go OFFLINE IMMEDIATELY instead of spinning
      # on "Preparing stream" for ~30 seconds.
      #
      # Runs with `if: always()` so it fires even when the main
      # stream step times out or fails.
      # ----------------------------------------------------------
      - name: "[8/8] Send RTMP end-of-stream signal (clean termination)"
        if: always()
        shell: bash
        run: |
          RTMP_URL="${{ steps.params.outputs.rtmp_url }}"
          RTMP_BASE="${{ steps.params.outputs.rtmp_base }}"
          WIDTH="${{ steps.params.outputs.width }}"
          HEIGHT="${{ steps.params.outputs.height }}"
          QUIET_NOISE="anoisesrc=r=44100:amplitude=0.001:color=white"

          echo ""
          echo "📡 [SA] ═════════════════════════════════════════════"
          echo "📡 [SA]  SENDING RTMP END-OF-STREAM SIGNAL"
          echo "📡 [SA] ═════════════════════════════════════════════"
          echo "📡 [SA]  Pushing 3-second pure-black clip + quiet noise floor."
          echo "📡 [SA]  This triggers RTMP deleteStream/FCUnpublish on the server,"
          echo "📡 [SA]  forcing YouTube Studio offline IMMEDIATELY with no spin."
          echo "📡 [SA]  Target: ${RTMP_BASE}****"
          echo ""

          # Use a 20s hard timeout (15s for the 3-second clip + TLS/network overhead)
          # kill-after=15s forces SIGKILL if SIGTERM is ignored
          timeout --kill-after=15s 20s \
            ffmpeg \
              -hide_banner -y \
              -f lavfi -i "color=c=black:s=${WIDTH}x${HEIGHT}:r=30:d=3" \
              -f lavfi -i "${QUIET_NOISE}" \
              -t 3 \
              -map 0:v \
              -map 1:a \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -profile:v baseline \
              -level:v 3.1 \
              -b:v 100k \
              -pix_fmt yuv420p \
              -r 30 \
              -g 30 \
              -keyint_min 30 \
              -sc_threshold 0 \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -ac 2 \
              -f flv \
              -flvflags no_duration_filesize \
              "${RTMP_URL}" \
            && echo "✅ [SA] End-of-stream signal delivered. YouTube Studio is going offline." \
            || echo "⚠️  [SA] End signal timed out or failed (YouTube will self-timeout in ~30s)."

          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║           StreamAdda v8 — SESSION COMPLETE          ║"
          echo "╚══════════════════════════════════════════════╝"
          printf "  Stream Name    : %s\n" "${{ steps.params.outputs.stream_name }}"
          printf "  Platform       : %s\n" "${{ steps.params.outputs.platform_label }}"
          printf "  Ratio          : %s\n" "${{ steps.params.outputs.ratio }}"
          printf "  Total Duration : %s minutes\n" "${{ steps.params.outputs.total_minutes }}"
          printf "  Photo Phase    : %ss\n" "${{ steps.timing.outputs.photo_dur }}"
          printf "  Video Phase    : %ss\n" "${{ steps.timing.outputs.video_dur_int }}"
          printf "  Video Audio    : %s\n" "${{ steps.timing.outputs.has_audio }}"
          printf "  FFmpeg Exit    : %s\n" "${{ steps.ffmpeg_stream.outputs.ffmpeg_exit_code }}"
          echo ""
          echo "  ✅ Stream session ended. Check YouTube Studio to confirm broadcast offline."
          echo ""
