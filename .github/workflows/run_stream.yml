name: "StreamAdda v9 — GitHub Actions Streaming Engine (Bulletproof)"

# ==============================================================
# TRIGGERS
# 1. repository_dispatch  →  fired by the Netlify frontend UI
#    event_type: "start-stream"
# 2. workflow_dispatch    →  manual run from the Actions tab
# ==============================================================
on:
  repository_dispatch:
    types: [start-stream]

  workflow_dispatch:
    inputs:
      stream_name:
        description: "Stream display name"
        required: false
        default: "Live Stream"
        type: string
      stream_key:
        description: "RTMP stream key (YouTube or Facebook)"
        required: true
        type: string
      platform:
        description: "Streaming platform"
        required: false
        default: "youtube"
        type: choice
        options: [youtube, facebook]
      ratio:
        description: "Video aspect ratio"
        required: false
        default: "9:16"
        type: choice
        options: ["9:16", "16:9"]
      total_minutes:
        description: "Total stream duration in minutes (max 345 enforced)"
        required: false
        default: "60"
        type: string
      asset_mode:
        description: "Asset mode: photo_video | photo_only | video_only"
        required: false
        default: "photo_video"
        type: choice
        options: [photo_video, photo_only, video_only]
      drive_mode:
        description: "Use Google Drive assets (true/false)"
        required: false
        default: "false"
        type: string
      photo_drive_url:
        description: "Google Drive URL for photo asset"
        required: false
        default: ""
        type: string
      video_drive_url:
        description: "Google Drive URL for video asset"
        required: false
        default: ""
        type: string
      photo_filename:
        description: "Photo filename in repo root (local mode)"
        required: false
        default: "live_photo.jpg"
        type: string
      video_filename:
        description: "Video filename in repo root (local mode)"
        required: false
        default: "live_video.mp4"
        type: string
      ambient_audio:
        description: "Enable ambient traffic noise audio (true/false)"
        required: false
        default: "false"
        type: string
      backup_rtmp:
        description: "Backup RTMP URL including key (optional)"
        required: false
        default: ""
        type: string
      youtube_video_id:
        description: "YouTube Video ID for Studio monitoring"
        required: false
        default: ""
        type: string
      start_at:
        description: "Scheduled start time (ISO 8601, e.g. 2024-06-01T14:30:00Z)"
        required: false
        default: ""
        type: string
      stop_at:
        description: "Hard stop time (ISO 8601, overrides duration if earlier)"
        required: false
        default: ""
        type: string


jobs:
  stream:
    name: "FFmpeg Live Stream Engine"
    runs-on: ubuntu-latest
    # GitHub's hard cap is 6 hours (360 min). Our logic enforces 345 min.
    # The extra 15 min headroom covers install + teardown steps.
    timeout-minutes: 360

    steps:

      # ============================================================
      # STEP 1 — Checkout repository
      # The repo root must contain photo/video assets in local mode.
      # ============================================================
      - name: "[1/8] Checkout repository"
        uses: actions/checkout@v4


      # ============================================================
      # STEP 2 — Extract, sanitise, and validate ALL parameters
      #
      # Supports BOTH trigger sources:
      #   repository_dispatch  → reads client_payload.payload_config (JSON bundle)
      #   workflow_dispatch    → reads github.event.inputs.*
      #
      # ╔══════════════════════════════════════════════════════════╗
      # ║  ROOT-CAUSE FIX — "exit code 100 / not valid JSON"      ║
      # ╠══════════════════════════════════════════════════════════╣
      # ║  PROBLEM: Inline GitHub expression expansion inside a   ║
      # ║  bash `run:` block — e.g.                               ║
      # ║    echo '${{ github.event.client_payload.payload_config }}'  ║
      # ║  — is performed by the Actions runner BEFORE the shell  ║
      # ║  ever sees the string.  Any double-quote, backslash,    ║
      # ║  dollar sign, or brace inside the JSON value is NOT     ║
      # ║  shell-escaped by the runner; it is injected verbatim   ║
      # ║  into the command line, where it immediately corrupts   ║
      # ║  shell grammar and silently mangles the JSON.           ║
      # ║                                                         ║
      # ║  SOLUTION: Use a step-level `env:` mapping.            ║
      # ║  The runner copies the raw value into an OS environment ║
      # ║  variable WITHOUT any shell interpretation.  The bash  ║
      # ║  script then reads it via $RAW_PAYLOAD_JSON — a plain  ║
      # ║  env-var read that is 100% metacharacter-safe.         ║
      # ╚══════════════════════════════════════════════════════════╝
      #
      # KEY INVARIANTS:
      #   ✔ 345-minute hard clamp — any duration > 345 is capped
      #   ✔ Asset mode routing — photo_only, video_only, photo_video
      #   ✔ Drive mode flag + URL extraction
      #   ✔ Ambient audio flag
      # ============================================================
      - name: "[2/8] Extract and validate parameters"
        id: params
        # ──────────────────────────────────────────────────────────
        # INJECTION-SAFE ENV CAPTURE
        # The entire payload_config JSON string is assigned to the
        # environment variable RAW_PAYLOAD_JSON at the runner level
        # before bash starts.  No shell expansion ever touches it.
        # This is the ONLY safe way to pass a JSON blob from a
        # GitHub Actions expression into a bash script.
        # ──────────────────────────────────────────────────────────
        env:
          RAW_PAYLOAD_JSON: ${{ github.event.client_payload.payload_config }}
        shell: bash
        run: |
          # ============================================================
          # v9 ABSOLUTE DURATION CLAMP CONSTANT  (declared FIRST)
          # GitHub Actions force-kills any job at 360 minutes (6h cap).
          # We enforce a hard mathematical ceiling of 345 minutes so
          # there is always ~15 min of headroom for install + teardown.
          # ============================================================
          readonly ABSOLUTE_MAX_MINUTES=345

          # ---- Pick values from the correct trigger source ----
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then

            # ========================================================
            # v9 SINGLE-BUNDLE CONTRACT (GitHub API 422 FIX)
            #
            # The frontend sends exactly ONE top-level client_payload
            # property: `payload_config`.  It is a JSON string that
            # contains EVERY parameter (stream_key, total_minutes,
            # ratio, platform, asset_mode, drive_mode, photo_filename,
            # video_filename, photo_drive_url, video_drive_url,
            # ambient_audio, plus optional extras).
            #
            # We read it from the env-var RAW_PAYLOAD_JSON (set in the
            # step-level `env:` block above) to avoid ALL shell-injection
            # risks.  Then we decode each field individually with jq.
            # ========================================================

            # ---- Guard: env var must be set and non-empty whitespace ----
            if [ -z "$(printf '%s' "${RAW_PAYLOAD_JSON:-}" | tr -d '[:space:]')" ]; then
              echo "⚠  [SA] payload_config was empty or missing. Falling back to empty object defaults." >&2
              RAW_PAYLOAD_JSON='{}'
            fi

            # ---- Strict JSON validation via jq ----
            # If the value is not parseable JSON, we emit the SA_STATUS
            # FAILED marker so the frontend poller can surface the exact
            # reason, then abort with exit 1 (NOT exit 100).
            if ! printf '%s' "${RAW_PAYLOAD_JSON}" | jq empty >/dev/null 2>&1; then
              echo "" >&2
              echo "[SA_STATUS:FAILED:payload_config is not valid JSON — cannot decode advanced options.]" >&2
              echo "❌ [SA] FATAL: RAW_PAYLOAD_JSON failed jq validation." >&2
              echo "    Raw value (first 200 chars): $(printf '%s' "${RAW_PAYLOAD_JSON}" | cut -c1-200)" >&2
              exit 1
            fi

            # ── jq helper: safely read one key, return empty string on null ──
            # Usage: pc KEY [DEFAULT]
            pc() {
              local val
              val=$(printf '%s' "${RAW_PAYLOAD_JSON}" | jq -r --arg k "$1" '.[$k] // empty' 2>/dev/null)
              # If empty and a default was supplied, echo the default
              if [ -z "$val" ] && [ -n "${2:-}" ]; then
                echo "$2"
              else
                echo "$val"
              fi
            }

            # ── Decode every field from the JSON bundle ──
            # These are the 11 mandatory fields the frontend guarantees:
            RAW_KEY=$(pc stream_key)
            RAW_MINUTES=$(pc total_minutes "60")
            RAW_RATIO=$(pc ratio "9:16")
            RAW_PLATFORM=$(pc platform "youtube")
            RAW_ASSET_MODE=$(pc asset_mode "photo_video")
            RAW_DRIVE_MODE=$(pc drive_mode "false")
            RAW_PHOTO_FILE=$(pc photo_filename "live_photo.jpg")
            RAW_VIDEO_FILE=$(pc video_filename "live_video.mp4")
            RAW_PHOTO_DRIVE=$(pc photo_drive_url)
            RAW_VIDEO_DRIVE=$(pc video_drive_url)
            RAW_AMBIENT=$(pc ambient_audio "false")

            # ── Optional extra fields (present in full bundle) ──
            RAW_NAME=$(pc stream_name "Live Stream")
            RAW_BACKUP=$(pc backup_rtmp)
            RAW_YTID=$(pc youtube_video_id)
            RAW_START_AT=$(pc start_at)
            RAW_STOP_AT=$(pc stop_at)

            AMBIENT_AUDIO_PROBE="$(printf '%s' "${RAW_PAYLOAD_JSON}" | jq -r '.ambient_audio // "false"' 2>/dev/null)"
            echo "✅ [SA] Decoded payload_config bundle via jq (ambient_audio=${AMBIENT_AUDIO_PROBE})."
            echo "🔎 [SA] Decoded: stream_key=**** total_minutes=${RAW_MINUTES} ratio=${RAW_RATIO} platform=${RAW_PLATFORM} asset_mode=${RAW_ASSET_MODE}"

          else
            # ── workflow_dispatch: read directly from inputs ──
            RAW_NAME="${{ github.event.inputs.stream_name }}"
            RAW_KEY="${{ github.event.inputs.stream_key }}"
            RAW_RATIO="${{ github.event.inputs.ratio }}"
            RAW_MINUTES="${{ github.event.inputs.total_minutes }}"
            RAW_PLATFORM="${{ github.event.inputs.platform }}"
            RAW_ASSET_MODE="${{ github.event.inputs.asset_mode }}"
            RAW_DRIVE_MODE="${{ github.event.inputs.drive_mode }}"
            RAW_PHOTO_DRIVE="${{ github.event.inputs.photo_drive_url }}"
            RAW_VIDEO_DRIVE="${{ github.event.inputs.video_drive_url }}"
            RAW_PHOTO_FILE="${{ github.event.inputs.photo_filename }}"
            RAW_VIDEO_FILE="${{ github.event.inputs.video_filename }}"
            RAW_AMBIENT="${{ github.event.inputs.ambient_audio }}"
            RAW_BACKUP="${{ github.event.inputs.backup_rtmp }}"
            RAW_YTID="${{ github.event.inputs.youtube_video_id }}"
            RAW_START_AT="${{ github.event.inputs.start_at }}"
            RAW_STOP_AT="${{ github.event.inputs.stop_at }}"
          fi

          # ---- Apply defaults ----
          STREAM_NAME="${RAW_NAME:-Live Stream}"
          STREAM_KEY="${RAW_KEY:-}"
          RATIO="${RAW_RATIO:-9:16}"
          TOTAL_MINUTES="${RAW_MINUTES:-60}"
          PLATFORM="${RAW_PLATFORM:-youtube}"
          ASSET_MODE="${RAW_ASSET_MODE:-photo_video}"
          DRIVE_MODE="${RAW_DRIVE_MODE:-false}"
          PHOTO_DRIVE_URL="${RAW_PHOTO_DRIVE:-}"
          VIDEO_DRIVE_URL="${RAW_VIDEO_DRIVE:-}"
          PHOTO_FILENAME="${RAW_PHOTO_FILE:-live_photo.jpg}"
          VIDEO_FILENAME="${RAW_VIDEO_FILE:-live_video.mp4}"
          AMBIENT_AUDIO="${RAW_AMBIENT:-false}"
          BACKUP_RTMP="${RAW_BACKUP:-}"
          YOUTUBE_VIDEO_ID="${RAW_YTID:-}"
          START_AT="${RAW_START_AT:-}"
          STOP_AT="${RAW_STOP_AT:-}"

          # ---- VALIDATE: stream key (required) ----
          if [ -z "$STREAM_KEY" ]; then
            echo "" >&2
            echo "[SA_STATUS:FAILED:stream_key is empty. Supply the RTMP key from YouTube Studio.]" >&2
            echo "❌ [SA] FATAL: stream_key is empty." >&2
            exit 1
          fi

          # ---- VALIDATE: ratio ----
          if [ "$RATIO" != "16:9" ] && [ "$RATIO" != "9:16" ]; then
            echo "⚠  [SA] Invalid ratio '${RATIO}'. Defaulting to 9:16."
            RATIO="9:16"
          fi

          # ---- VALIDATE & CLAMP: total_minutes (THE 360-MINUTE BUG FIX) ----
          # Any value that is non-numeric, below 2, or above 345 is corrected
          # RIGHT HERE before any downstream arithmetic can misfire.
          if ! echo "$TOTAL_MINUTES" | grep -qE '^[0-9]+$'; then
            echo "⚠  [SA] Non-numeric total_minutes '${TOTAL_MINUTES}'. Defaulting to 60."
            TOTAL_MINUTES=60
          fi
          if [ "$TOTAL_MINUTES" -lt 2 ]; then
            echo "⚠  [SA] total_minutes < 2. Clamping to 2."
            TOTAL_MINUTES=2
          fi
          if [ "$TOTAL_MINUTES" -gt "$ABSOLUTE_MAX_MINUTES" ]; then
            echo "⚠  [SA] total_minutes=${TOTAL_MINUTES} exceeds safety cap. CLAMPING TO ${ABSOLUTE_MAX_MINUTES}."
            TOTAL_MINUTES=$ABSOLUTE_MAX_MINUTES
          fi

          # ---- VALIDATE: asset mode ----
          case "$ASSET_MODE" in
            photo_only|video_only|photo_video) ;;
            *)
              echo "⚠  [SA] Unknown asset_mode '${ASSET_MODE}'. Defaulting to photo_video."
              ASSET_MODE="photo_video"
              ;;
          esac

          # ---- VALIDATE: platform + RTMP base URL ----
          if [ "$PLATFORM" = "facebook" ]; then
            RTMP_BASE="rtmps://live-api-s.facebook.com:443/rtmp/"
            PLATFORM_LABEL="Facebook Live"
          else
            PLATFORM="youtube"
            RTMP_BASE="rtmps://a.rtmp.youtube.com/live2/"
            PLATFORM_LABEL="YouTube Live"
          fi
          RTMP_URL="${RTMP_BASE}${STREAM_KEY}"

          # ---- Set canvas dimensions from ratio ----
          if [ "$RATIO" = "16:9" ]; then
            WIDTH=1280; HEIGHT=720
          else
            WIDTH=720;  HEIGHT=1280
          fi

          # ---- Normalise boolean flags ----
          normalise_bool() {
            case "${1,,}" in true|1|yes|on) echo true;; *) echo false;; esac
          }
          DRIVE_MODE=$(normalise_bool "$DRIVE_MODE")
          AMBIENT_AUDIO=$(normalise_bool "$AMBIENT_AUDIO")

          # ---- Export all outputs for downstream steps ----
          echo "stream_name=${STREAM_NAME}"             >> "$GITHUB_OUTPUT"
          echo "stream_key=${STREAM_KEY}"               >> "$GITHUB_OUTPUT"
          echo "ratio=${RATIO}"                         >> "$GITHUB_OUTPUT"
          echo "total_minutes=${TOTAL_MINUTES}"         >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM}"                   >> "$GITHUB_OUTPUT"
          echo "platform_label=${PLATFORM_LABEL}"       >> "$GITHUB_OUTPUT"
          echo "asset_mode=${ASSET_MODE}"               >> "$GITHUB_OUTPUT"
          echo "drive_mode=${DRIVE_MODE}"               >> "$GITHUB_OUTPUT"
          echo "photo_drive_url=${PHOTO_DRIVE_URL}"     >> "$GITHUB_OUTPUT"
          echo "video_drive_url=${VIDEO_DRIVE_URL}"     >> "$GITHUB_OUTPUT"
          echo "photo_filename=${PHOTO_FILENAME}"       >> "$GITHUB_OUTPUT"
          echo "video_filename=${VIDEO_FILENAME}"       >> "$GITHUB_OUTPUT"
          echo "ambient_audio=${AMBIENT_AUDIO}"         >> "$GITHUB_OUTPUT"
          echo "backup_rtmp=${BACKUP_RTMP}"             >> "$GITHUB_OUTPUT"
          echo "youtube_video_id=${YOUTUBE_VIDEO_ID}"   >> "$GITHUB_OUTPUT"
          echo "start_at=${START_AT}"                   >> "$GITHUB_OUTPUT"
          echo "stop_at=${STOP_AT}"                     >> "$GITHUB_OUTPUT"
          echo "rtmp_url=${RTMP_URL}"                   >> "$GITHUB_OUTPUT"
          echo "rtmp_base=${RTMP_BASE}"                 >> "$GITHUB_OUTPUT"
          echo "width=${WIDTH}"                         >> "$GITHUB_OUTPUT"
          echo "height=${HEIGHT}"                       >> "$GITHUB_OUTPUT"

          # ---- Print configuration banner ----
          echo ""
          echo "╔═══════════════════════════════════════════════╗"
          echo "║       StreamAdda v9 — GitHub Actions Engine  ║"
          echo "╚═══════════════════════════════════════════════╝"
          printf "  Stream Name    : %s\n"  "$STREAM_NAME"
          printf "  Platform       : %s\n"  "$PLATFORM_LABEL"
          printf "  Ratio          : %s (%sx%s)\n" "$RATIO" "$WIDTH" "$HEIGHT"
          printf "  Duration       : %s min (SAFETY CAP: 345)\n" "$TOTAL_MINUTES"
          printf "  Asset Mode     : %s\n"  "$ASSET_MODE"
          printf "  Drive Mode     : %s\n"  "$DRIVE_MODE"
          printf "  Ambient Audio  : %s\n"  "$AMBIENT_AUDIO"
          printf "  RTMP Target    : %s****\n" "$RTMP_BASE"
          [ -n "$BACKUP_RTMP" ] && printf "  Backup RTMP    : Configured\n" || printf "  Backup RTMP    : None\n"
          [ -n "$START_AT" ] && printf "  Sched. Start   : %s\n" "$START_AT" || printf "  Sched. Start   : Immediate\n"
          [ -n "$STOP_AT"  ] && printf "  Hard Stop At   : %s\n" "$STOP_AT"
          echo ""


      # ============================================================
      # STEP 3 — Install FFmpeg and all required codec libraries
      # ============================================================
      - name: "[3/8] Install FFmpeg and system dependencies"
        shell: bash
        run: |
          echo "📦 [SA] Updating apt package lists..."
          sudo apt-get update -qq

          echo "📦 [SA] Installing FFmpeg, codecs, and tools..."
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libavcodec-extra \
            python3 \
            python3-pip \
            jq \
            curl \
            wget \
            procps \
            coreutils

          echo ""
          echo "✅ [SA] FFmpeg installation complete."
          echo "🔍 [SA] Verifying FFmpeg binary:"
          ffmpeg -version 2>&1 | head -4
          echo "✅ [SA] All codec libraries confirmed."
          echo ""


      # ============================================================
      # STEP 4 — Download or verify source media assets
      #
      # TWO sub-modes:
      #   A) DRIVE MODE (drive_mode=true):
      #      Download photo and/or video from Google Drive
      #   B) LOCAL MODE (drive_mode=false):
      #      Verify that the required filenames exist in the repo root
      #
      # asset_mode controls which assets are required:
      #   photo_only  → only photo required
      #   video_only  → only video required
      #   photo_video → both required
      # ============================================================
      - name: "[4/8] Download or verify source media assets"
        id: assets
        shell: bash
        run: |
          ASSET_MODE="${{ steps.params.outputs.asset_mode }}"
          DRIVE_MODE="${{ steps.params.outputs.drive_mode }}"
          PHOTO_DRIVE_URL="${{ steps.params.outputs.photo_drive_url }}"
          VIDEO_DRIVE_URL="${{ steps.params.outputs.video_drive_url }}"
          PHOTO_FILENAME="${{ steps.params.outputs.photo_filename }}"
          VIDEO_FILENAME="${{ steps.params.outputs.video_filename }}"

          NEEDS_PHOTO=false
          NEEDS_VIDEO=false
          case "$ASSET_MODE" in
            photo_only)  NEEDS_PHOTO=true ;;
            video_only)  NEEDS_VIDEO=true ;;
            photo_video) NEEDS_PHOTO=true; NEEDS_VIDEO=true ;;
          esac

          echo ""
          echo "📂 [SA] Asset mode: ${ASSET_MODE}  |  Drive mode: ${DRIVE_MODE}"
          echo "📂 [SA] Needs photo: ${NEEDS_PHOTO}  |  Needs video: ${NEEDS_VIDEO}"
          echo ""

          # ----------------------------------------------------------
          # FAIL-SAFE FALLBACK ENGINE
          # If a Google Drive asset cannot be fetched or validated, we
          # recover by using repo-root placeholders.  If those are also
          # absent, FFmpeg synthesises a minimal placeholder so the
          # pipeline NEVER hangs in an infinite "starting" cycle.
          # ----------------------------------------------------------
          fallback_asset() {
            local KIND="$1"
            if [ "$KIND" = "photo" ]; then
              if [ "${PHOTO_FILENAME}" != "live_photo.jpg" ] && [ -f "${PHOTO_FILENAME}" ] && [ -s "${PHOTO_FILENAME}" ]; then
                cp -f "${PHOTO_FILENAME}" live_photo.jpg
                echo "OK [SA] Fallback: repo placeholder '${PHOTO_FILENAME}' -> live_photo.jpg"
              elif [ -f "live_photo.jpg" ] && [ -s "live_photo.jpg" ]; then
                echo "OK [SA] Fallback: using repo root 'live_photo.jpg'."
              else
                echo "WARN [SA] No repo photo placeholder. Synthesising placeholder image."
                ffmpeg -hide_banner -y -f lavfi -i "color=c=0x0f172a:s=720x1280:d=1" -frames:v 1 live_photo.jpg >/dev/null 2>&1 || \
                ffmpeg -hide_banner -y -f lavfi -i "color=c=black:s=720x1280:d=1" -frames:v 1 live_photo.jpg >/dev/null 2>&1
              fi
            else
              if [ "${VIDEO_FILENAME}" != "live_video.mp4" ] && [ -f "${VIDEO_FILENAME}" ] && [ -s "${VIDEO_FILENAME}" ]; then
                cp -f "${VIDEO_FILENAME}" live_video.mp4
                echo "OK [SA] Fallback: repo placeholder '${VIDEO_FILENAME}' -> live_video.mp4"
              elif [ -f "live_video.mp4" ] && [ -s "live_video.mp4" ]; then
                echo "OK [SA] Fallback: using repo root 'live_video.mp4'."
              else
                echo "WARN [SA] No repo video placeholder. Synthesising 5s placeholder clip."
                ffmpeg -hide_banner -y \
                  -f lavfi -i "color=c=black:s=720x1280:r=30:d=5" \
                  -f lavfi -i "anoisesrc=r=44100:amplitude=0.001:color=white" \
                  -shortest -t 5 -c:v libx264 -pix_fmt yuv420p \
                  -c:a aac -b:a 128k -ar 44100 -ac 2 live_video.mp4 >/dev/null 2>&1
              fi
            fi
            if [ "$KIND" = "photo" ] && { [ ! -f live_photo.jpg ] || [ ! -s live_photo.jpg ]; }; then
              echo "[SA_STATUS:FAILED:Photo asset unrecoverable after Drive + placeholder fallback]" >&2
              exit 1
            fi
            if [ "$KIND" = "video" ] && { [ ! -f live_video.mp4 ] || [ ! -s live_video.mp4 ]; }; then
              echo "[SA_STATUS:FAILED:Video asset unrecoverable after Drive + placeholder fallback]" >&2
              exit 1
            fi
          }

          download_from_drive() {
            local DRIVE_URL="$1"
            local OUTPUT_PATH="$2"
            local ASSET_LABEL="$3"

            echo "📥 [SA] Downloading ${ASSET_LABEL} from Google Drive..."
            echo "    URL: ${DRIVE_URL}"

            local FILE_ID
            FILE_ID=$(echo "$DRIVE_URL" | grep -oP '(?<=/d/)[^/?]+' | head -1)
            if [ -z "$FILE_ID" ]; then
              FILE_ID=$(echo "$DRIVE_URL" | grep -oP '(?<=id=)[^&]+' | head -1)
            fi
            if [ -z "$FILE_ID" ]; then
              echo "❌ [SA] Cannot extract Google Drive file ID from URL: ${DRIVE_URL}" >&2
              return 1
            fi
            echo "    File ID: ${FILE_ID}"

            local COOKIE_JAR
            COOKIE_JAR=$(mktemp /tmp/drive_cookies_XXXXXX)

            local CONFIRM_TOKEN
            CONFIRM_TOKEN=$(curl -sc "$COOKIE_JAR" -L \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
              2>/dev/null \
              | grep -oP '(?<=confirm=)[^&"]+' | head -1)

            if [ -n "$CONFIRM_TOKEN" ]; then
              echo "    Large file detected. Using confirmation token: ${CONFIRM_TOKEN}"
              curl -Lb "$COOKIE_JAR" \
                "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=${CONFIRM_TOKEN}" \
                -o "${OUTPUT_PATH}.part" \
                --progress-bar 2>&1
            else
              echo "    Standard file. Downloading directly..."
              curl -L \
                "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&authuser=0" \
                -o "${OUTPUT_PATH}.part" \
                --progress-bar 2>&1
            fi

            rm -f "$COOKIE_JAR"

            if [ ! -f "${OUTPUT_PATH}.part" ] || [ ! -s "${OUTPUT_PATH}.part" ]; then
              echo "WARN [SA] Drive download failed or returned empty for ${ASSET_LABEL}." >&2
              rm -f "${OUTPUT_PATH}.part"
              return 1
            fi

            mv -f "${OUTPUT_PATH}.part" "${OUTPUT_PATH}"
            local FILE_SIZE
            FILE_SIZE=$(du -sh "$OUTPUT_PATH" | awk '{print $1}')
            echo "OK [SA] ${ASSET_LABEL} downloaded and verified. Size: ${FILE_SIZE}"
          }

          # ----------------------------------------------------------
          # ASSET ACQUISITION
          # ----------------------------------------------------------
          if [ "$DRIVE_MODE" = "true" ]; then
            echo "☁  [SA] DRIVE MODE active. Downloading assets from Google Drive..."

            if [ "$NEEDS_PHOTO" = "true" ]; then
              if [ -z "$PHOTO_DRIVE_URL" ]; then
                echo "❌ [SA] FATAL: photo_drive_url is required for mode '${ASSET_MODE}' with Drive mode ON." >&2
                echo "[SA_STATUS:FAILED:photo_drive_url missing for mode ${ASSET_MODE}]"
                exit 1
              fi
              if ! download_from_drive "$PHOTO_DRIVE_URL" "live_photo.jpg" "PHOTO"; then
                echo "WARN [SA] Drive PHOTO fetch failed. Engaging fail-safe fallback."
                fallback_asset photo
              fi
              if ! file live_photo.jpg | grep -qiE 'image|jpeg|png|jpg'; then
                echo "WARN [SA] live_photo.jpg is not a valid image. Engaging fallback."
                fallback_asset photo
              fi
            fi

            if [ "$NEEDS_VIDEO" = "true" ]; then
              if [ -z "$VIDEO_DRIVE_URL" ]; then
                echo "❌ [SA] FATAL: video_drive_url is required for mode '${ASSET_MODE}' with Drive mode ON." >&2
                echo "[SA_STATUS:FAILED:video_drive_url missing for mode ${ASSET_MODE}]"
                exit 1
              fi
              if ! download_from_drive "$VIDEO_DRIVE_URL" "live_video.mp4" "VIDEO"; then
                echo "WARN [SA] Drive VIDEO fetch failed. Engaging fail-safe fallback."
                fallback_asset video
              fi
            fi

          else
            echo "📁 [SA] LOCAL MODE active. Verifying repository assets..."
            MISSING=false

            if [ "$NEEDS_PHOTO" = "true" ]; then
              if [ ! -f "${PHOTO_FILENAME}" ]; then
                echo "❌ [SA] FATAL: Photo file '${PHOTO_FILENAME}' NOT FOUND in repository root!" >&2
                MISSING=true
              else
                local_size=$(du -sh "${PHOTO_FILENAME}" | awk '{print $1}')
                echo "✅ [SA] Photo file found: ${PHOTO_FILENAME} (${local_size})"
                [ "${PHOTO_FILENAME}" != "live_photo.jpg" ] && cp "${PHOTO_FILENAME}" live_photo.jpg
              fi
            fi

            if [ "$NEEDS_VIDEO" = "true" ]; then
              if [ ! -f "${VIDEO_FILENAME}" ]; then
                echo "❌ [SA] FATAL: Video file '${VIDEO_FILENAME}' NOT FOUND in repository root!" >&2
                MISSING=true
              else
                local_size=$(du -sh "${VIDEO_FILENAME}" | awk '{print $1}')
                echo "✅ [SA] Video file found: ${VIDEO_FILENAME} (${local_size})"
                [ "${VIDEO_FILENAME}" != "live_video.mp4" ] && cp "${VIDEO_FILENAME}" live_video.mp4
              fi
            fi

            if [ "$MISSING" = "true" ]; then
              echo "[SA_STATUS:FAILED:Required media files missing from repository]"
              exit 1
            fi
          fi

          echo ""
          echo "✅ [SA] All required assets acquired and ready."
          echo ""


      # ============================================================
      # STEP 5 — Probe media files and calculate stream timing plan
      # ============================================================
      - name: "[5/8] Probe assets and calculate timing plan"
        id: timing
        shell: bash
        run: |
          ASSET_MODE="${{ steps.params.outputs.asset_mode }}"
          TOTAL_MINUTES="${{ steps.params.outputs.total_minutes }}"
          TOTAL_SECONDS=$(( TOTAL_MINUTES * 60 ))

          echo "🎬 [SA] Calculating timing plan for mode: ${ASSET_MODE}"
          echo "    Total duration: ${TOTAL_MINUTES} min (${TOTAL_SECONDS}s)"
          echo ""

          VIDEO_DUR_RAW="0"
          VIDEO_DUR_INT=0
          VIDEO_DUR_NOISE=2
          PHOTO_DUR=$TOTAL_SECONDS
          HAS_AUDIO="false"

          if [ "$ASSET_MODE" = "photo_video" ] || [ "$ASSET_MODE" = "video_only" ]; then
            echo "🔍 [SA] Probing live_video.mp4 with ffprobe..."

            VIDEO_DUR_RAW=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              live_video.mp4 2>/dev/null)

            if [ -z "$VIDEO_DUR_RAW" ] || [ "$VIDEO_DUR_RAW" = "N/A" ]; then
              echo "❌ [SA] FATAL: ffprobe could not determine video duration." >&2
              echo "[SA_STATUS:FAILED:ffprobe failed — live_video.mp4 may be corrupt]"
              exit 1
            fi

            HAS_AUDIO_RAW=$(ffprobe \
              -v error \
              -select_streams a \
              -show_entries stream=index \
              -of csv=p=0 \
              live_video.mp4 2>/dev/null)
            [ -n "$HAS_AUDIO_RAW" ] && HAS_AUDIO="true" || HAS_AUDIO="false"

            VIDEO_DUR_INT=$(python3 -c "print(int(float('${VIDEO_DUR_RAW}'.strip())))")
            VIDEO_DUR_NOISE=$(( VIDEO_DUR_INT + 2 ))

            echo "    Video duration : ${VIDEO_DUR_INT}s  |  Has audio: ${HAS_AUDIO}"
          fi

          if [ "$ASSET_MODE" = "photo_video" ]; then
            PHOTO_DUR=$(( TOTAL_SECONDS - VIDEO_DUR_INT ))
            if [ "$PHOTO_DUR" -le 10 ]; then
              NEEDED_MIN=$(python3 -c "import math; print(math.ceil((${VIDEO_DUR_INT} + 11) / 60))")
              echo "❌ [SA] FATAL: video (${VIDEO_DUR_INT}s) is too long for ${TOTAL_SECONDS}s total." >&2
              echo "[SA_STATUS:FAILED:video too long for chosen duration — increase total_minutes to ${NEEDED_MIN}]"
              exit 1
            fi
          elif [ "$ASSET_MODE" = "photo_only" ]; then
            PHOTO_DUR=$TOTAL_SECONDS
            VIDEO_DUR_INT=0
          else
            PHOTO_DUR=0
          fi

          echo ""
          echo "┌─────────────────────────────────────────────────┐"
          echo "│            TIMING PLAN CONFIRMED                │"
          echo "├─────────────────────────────────────────────────┤"
          printf "│  Mode          : %-30s │\n" "${ASSET_MODE}"
          printf "│  📸 Photo phase: %-30s │\n" "${PHOTO_DUR}s"
          printf "│  🎬 Video phase: %-30s │\n" "${VIDEO_DUR_INT}s"
          printf "│  ⏱  Total      : %-30s │\n" "${TOTAL_SECONDS}s (${TOTAL_MINUTES}m)"
          printf "│  🔊 Video audio: %-30s │\n" "${HAS_AUDIO}"
          echo "└─────────────────────────────────────────────────┘"
          echo ""

          echo "video_dur=${VIDEO_DUR_RAW}"         >> "$GITHUB_OUTPUT"
          echo "video_dur_int=${VIDEO_DUR_INT}"     >> "$GITHUB_OUTPUT"
          echo "video_dur_noise=${VIDEO_DUR_NOISE}" >> "$GITHUB_OUTPUT"
          echo "photo_dur=${PHOTO_DUR}"             >> "$GITHUB_OUTPUT"
          echo "total_seconds=${TOTAL_SECONDS}"     >> "$GITHUB_OUTPUT"
          echo "has_audio=${HAS_AUDIO}"             >> "$GITHUB_OUTPUT"


      # ============================================================
      # STEP 6 — Handle scheduled start time
      # ============================================================
      - name: "[6/8] Handle scheduled start time"
        shell: bash
        run: |
          START_AT="${{ steps.params.outputs.start_at }}"

          if [ -z "$START_AT" ]; then
            echo "⏰ [SA] No scheduled start time — launching immediately."
            exit 0
          fi

          echo "⏰ [SA] Scheduled start time: ${START_AT}"

          DELAY=$(python3 - <<PYEOF
          import datetime, sys
          try:
              s = "${START_AT}".strip()
              if not s: print(0); sys.exit(0)
              if s.endswith('Z'): s = s[:-1] + '+00:00'
              target = datetime.datetime.fromisoformat(s)
              if target.tzinfo is None:
                  target = target.replace(tzinfo=datetime.timezone.utc)
              now = datetime.datetime.now(datetime.timezone.utc)
              delay = (target - now).total_seconds()
              print(max(0, int(delay)))
          except Exception as e:
              print(f"[SA][WARN] Could not parse start_at: {e}", file=sys.stderr)
              print(0)
          PYEOF
          )

          if [ "$DELAY" -gt 0 ]; then
            MAX_WAIT=18000
            [ "$DELAY" -gt "$MAX_WAIT" ] && { echo "⚠  [SA] Wait exceeds 5h cap. Capping."; DELAY=$MAX_WAIT; }
            H=$(( DELAY/3600 )); M=$(( (DELAY%3600)/60 )); S=$(( DELAY%60 ))
            echo "⏰ [SA] Waiting ${H}h ${M}m ${S}s until scheduled start..."
            sleep "$DELAY"
            echo "✅ [SA] Scheduled start time reached. Proceeding."
          else
            echo "✅ [SA] Scheduled time is in the past — starting immediately."
          fi


      # ============================================================
      # STEP 7 — THE CORE ENGINE: Adaptive FFmpeg stream
      #
      # THREE fully dynamic FFmpeg command builders, one per asset_mode.
      # Every mode uses a single uninterrupted FFmpeg process.
      #
      # RTMP RECONNECT WATCHDOG FLAGS (preserved as mandated):
      #   -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1
      #   These ensure the stream auto-recovers from transient drops.
      #
      # AMBIENT AUDIO:
      #   true  → pink+white noise mix simulating outdoor traffic
      #   false → inaudible -60 dB white noise floor (YouTube-safe)
      #
      # CONNECTION DETECTION (STRICT "NO FALSE LIVE" FIX):
      #   [SA_STATUS:HANDSHAKE_OK] is emitted only after FFmpeg stderr
      #   confirms actual packet transmission.  The UI MUST wait for
      #   this before flipping the badge to ONLINE.
      #
      # WATCHDOG:
      #   SIGTERM fires exactly when total_minutes (capped at 345)
      #   elapses, or when stop_at is reached, whichever is earlier.
      # ============================================================
      - name: "[7/8] Launch adaptive FFmpeg stream"
        id: ffmpeg_stream
        shell: bash
        run: |
          # ============================================================
          # RESILIENCE POLICY
          # We manage every error explicitly and ALWAYS exit 0 at the end
          # so Step 8 (clean teardown) runs and GitHub marks the job as
          # SUCCESS for normal timed streams. Disabling -e/-o pipefail is
          # required because grep/ps in the monitor legitimately return
          # non-zero (no-match) and MUST NOT abort the step.
          # ============================================================
          set +e
          set +o pipefail

          RTMP_URL="${{ steps.params.outputs.rtmp_url }}"
          RTMP_BASE="${{ steps.params.outputs.rtmp_base }}"
          WIDTH="${{ steps.params.outputs.width }}"
          HEIGHT="${{ steps.params.outputs.height }}"
          RATIO="${{ steps.params.outputs.ratio }}"
          PLATFORM="${{ steps.params.outputs.platform }}"
          TOTAL_MINUTES="${{ steps.params.outputs.total_minutes }}"
          STOP_AT="${{ steps.params.outputs.stop_at }}"
          ASSET_MODE="${{ steps.params.outputs.asset_mode }}"
          AMBIENT_AUDIO="${{ steps.params.outputs.ambient_audio }}"
          PHOTO_DUR="${{ steps.timing.outputs.photo_dur }}"
          VIDEO_DUR_INT="${{ steps.timing.outputs.video_dur_int }}"
          VIDEO_DUR_NOISE="${{ steps.timing.outputs.video_dur_noise }}"
          TOTAL_SECONDS="${{ steps.timing.outputs.total_seconds }}"
          HAS_AUDIO="${{ steps.timing.outputs.has_audio }}"
          export STOP_AT

          FFMPEG_LOG="/tmp/ffmpeg_stderr.log"
          PID_FILE="/tmp/ffmpeg_current.pid"
          DONE_FILE="/tmp/sa_stream_done"
          FAIL_FILE="/tmp/sa_setup_failed"
          rm -f "$PID_FILE" "$DONE_FILE" "$FAIL_FILE"
          : > "$FFMPEG_LOG"
          FFMPEG_EXIT=0

          ASSET_MODE_UPPER=$(printf '%s' "$ASSET_MODE" | tr '[:lower:]' '[:upper:]')
          if [ "$ASSET_MODE" = "video_only" ]; then INITIAL_PHASE="VIDEO"; else INITIAL_PHASE="PHOTO"; fi

          QUIET_NOISE="anoisesrc=r=44100:amplitude=0.001:color=white"
          AMBIENT_NOISE="anoisesrc=r=44100:amplitude=0.09:color=pink,lowpass=f=400,highpass=f=40,volume=1.6,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
          if [ "$AMBIENT_AUDIO" = "true" ]; then
            PHOTO_AUDIO_SRC="$AMBIENT_NOISE"; echo "[SA] Ambient traffic audio ENABLED."
          else
            PHOTO_AUDIO_SRC="$QUIET_NOISE"; echo "[SA] Standard quiet noise floor."
          fi

          vf_template() { local IN="$1" OUT="$2"; echo "[${IN}]scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=30,format=yuv420p[${OUT}]"; }
          af_template() { local IN="$1" OUT="$2"; echo "[${IN}]aresample=async=1:first_pts=0,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100[${OUT}]"; }

          # ---- Duration model (second-accurate). stop_at wins if earlier ----
          TARGET_SECONDS="$TOTAL_SECONDS"
          if [ -n "$STOP_AT" ]; then
            STOP_SECS=$(python3 - <<'PYEOF'
          import datetime, os
          s = os.environ.get("STOP_AT", "").strip()
          try:
              if s.endswith("Z"): s = s[:-1] + "+00:00"
              t = datetime.datetime.fromisoformat(s)
              if t.tzinfo is None: t = t.replace(tzinfo=datetime.timezone.utc)
              now = datetime.datetime.now(datetime.timezone.utc)
              print(max(0, int((t - now).total_seconds())))
          except Exception:
              print(-1)
          PYEOF
          )
            if [ "$STOP_SECS" -gt 0 ] && [ "$STOP_SECS" -lt "$TARGET_SECONDS" ]; then
              echo "[SA] Hard stop_at deadline is earlier: ${STOP_SECS}s from now."
              TARGET_SECONDS="$STOP_SECS"
            fi
          fi
          HARD_TIMEOUT=$(( TARGET_SECONDS + 8 ))
          START_EPOCH=$(date +%s)
          END_TARGET_EPOCH=$(( START_EPOCH + TARGET_SECONDS ))
          END_HARD_EPOCH=$(( START_EPOCH + HARD_TIMEOUT ))

          echo ""
          echo "[SA] LAUNCHING ADAPTIVE FFMPEG STREAMING SESSION"
          printf "[SA]  Platform     : %s | %s | %sx%s\n" "$PLATFORM" "$RATIO" "$WIDTH" "$HEIGHT"
          printf "[SA]  Asset mode   : %s\n" "$ASSET_MODE"
          printf "[SA]  Photo phase  : %ss\n" "$PHOTO_DUR"
          printf "[SA]  Video phase  : %ss (audio: %s)\n" "$VIDEO_DUR_INT" "$HAS_AUDIO"
          printf "[SA]  Target dur   : %ss (hard cap %ss)\n" "$TARGET_SECONDS" "$HARD_TIMEOUT"
          printf "[SA]  Ambient      : %s\n" "$AMBIENT_AUDIO"
          printf "[SA]  RTMP target  : %s****\n" "$RTMP_BASE"
          echo ""
          echo "[SA_STATUS:CONNECTING]"

          # ---- Shared FFmpeg launcher: streams exactly $STREAM_CUT s then exits 0 ----
          run_ffmpeg_with_args() {
            ffmpeg -hide_banner -y \
              "$@" \
              -t "${STREAM_CUT}" \
              -c:v libx264 -preset veryfast -tune zerolatency \
              -profile:v main -level:v 4.0 \
              -b:v 2500k -minrate 2500k -maxrate 2500k -bufsize 5000k \
              -pix_fmt yuv420p -r 30 -g 60 -keyint_min 60 -sc_threshold 0 -x264opts no-scenecut \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -max_muxing_queue_size 1024 \
              -fflags +genpts \
              -f flv -flvflags no_duration_filesize \
              -rw_timeout 15000000 \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              "${RTMP_URL}" >>"$FFMPEG_LOG" 2>&1 &
            local P=$!
            echo "$P" > "$PID_FILE"
            wait "$P"
            return $?
          }

          # ---- MODE A: PHOTO + VIDEO (single continuous concat pipe) ----
          # FIX: no-audio substitute silence is now exactly VIDEO_DUR_INT
          # (was VIDEO_DUR_INT+2, which froze ~2s and stalled the handoff);
          # +genpts keeps timestamps monotonic across the concat boundary.
          run_photo_video_mode() {
            local VFILTER_PHOTO; VFILTER_PHOTO=$(vf_template "0:v" "v0")
            local VFILTER_VIDEO; VFILTER_VIDEO=$(vf_template "2:v" "v1")
            local AFILTER_PHOTO; AFILTER_PHOTO=$(af_template "1:a" "a0")
            if [ "$HAS_AUDIO" = "true" ]; then
              local FC="${VFILTER_PHOTO};${VFILTER_VIDEO};${AFILTER_PHOTO};[2:a]aresample=async=1:first_pts=0,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[vout][aout]"
              run_ffmpeg_with_args \
                -re -loop 1 -framerate 30 -t "${PHOTO_DUR}" -i live_photo.jpg \
                -f lavfi -t "${PHOTO_DUR}" -i "${PHOTO_AUDIO_SRC}" \
                -re -i live_video.mp4 \
                -filter_complex "${FC}" \
                -map "[vout]" -map "[aout]"
            else
              local FC="${VFILTER_PHOTO};${VFILTER_VIDEO};${AFILTER_PHOTO};[3:a]aresample=async=1:first_pts=0,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[vout][aout]"
              run_ffmpeg_with_args \
                -re -loop 1 -framerate 30 -t "${PHOTO_DUR}" -i live_photo.jpg \
                -f lavfi -t "${PHOTO_DUR}" -i "${PHOTO_AUDIO_SRC}" \
                -re -i live_video.mp4 \
                -f lavfi -t "${VIDEO_DUR_INT}" -i "${QUIET_NOISE}" \
                -filter_complex "${FC}" \
                -map "[vout]" -map "[aout]"
            fi
          }

          # ---- MODE B: PHOTO ONLY ----
          run_photo_only_mode() {
            local VFILTER; VFILTER=$(vf_template "0:v" "vout")
            local AFILTER; AFILTER=$(af_template "1:a" "aout")
            echo "[SA] PHOTO ONLY mode: looping photo."
            run_ffmpeg_with_args \
              -re -loop 1 -framerate 30 -t "${TOTAL_SECONDS}" -i live_photo.jpg \
              -f lavfi -t "${TOTAL_SECONDS}" -i "${PHOTO_AUDIO_SRC}" \
              -filter_complex "${VFILTER};${AFILTER}" \
              -map "[vout]" -map "[aout]"
          }

          # ---- MODE C: VIDEO ONLY (infinite loop, cut by output -t) ----
          run_video_only_mode() {
            echo "[SA] VIDEO ONLY mode: looping video."
            local VFILTER; VFILTER=$(vf_template "0:v" "vout")
            if [ "$HAS_AUDIO" = "true" ]; then
              local AFILTER; AFILTER=$(af_template "0:a" "aout")
              run_ffmpeg_with_args \
                -stream_loop -1 -re -i live_video.mp4 \
                -filter_complex "${VFILTER};${AFILTER}" \
                -map "[vout]" -map "[aout]"
            else
              local AFILTER; AFILTER=$(af_template "1:a" "aout")
              run_ffmpeg_with_args \
                -stream_loop -1 -re -i live_video.mp4 \
                -f lavfi -i "${PHOTO_AUDIO_SRC}" \
                -filter_complex "${VFILTER};${AFILTER}" \
                -map "[vout]" -map "[aout]"
            fi
          }

          # ---- FILL MODE: watchdog auto-restart after an early drop ----
          run_fill_mode() {
            local VFILTER AFILTER
            if [ "$ASSET_MODE" = "photo_only" ]; then
              VFILTER=$(vf_template "0:v" "vout"); AFILTER=$(af_template "1:a" "aout")
              run_ffmpeg_with_args \
                -re -loop 1 -framerate 30 -i live_photo.jpg \
                -f lavfi -i "${PHOTO_AUDIO_SRC}" \
                -filter_complex "${VFILTER};${AFILTER}" \
                -map "[vout]" -map "[aout]"
            else
              VFILTER=$(vf_template "0:v" "vout")
              if [ "$HAS_AUDIO" = "true" ]; then
                AFILTER=$(af_template "0:a" "aout")
                run_ffmpeg_with_args \
                  -stream_loop -1 -re -i live_video.mp4 \
                  -filter_complex "${VFILTER};${AFILTER}" \
                  -map "[vout]" -map "[aout]"
              else
                AFILTER=$(af_template "1:a" "aout")
                run_ffmpeg_with_args \
                  -stream_loop -1 -re -i live_video.mp4 \
                  -f lavfi -i "${PHOTO_AUDIO_SRC}" \
                  -filter_complex "${VFILTER};${AFILTER}" \
                  -map "[vout]" -map "[aout]"
              fi
            fi
          }

          # ---- Hard-deadline killer (backup watchdog) ----
          deadline_killer() {
            while [ ! -f "$DONE_FILE" ]; do
              local NOW; NOW=$(date +%s)
              if [ "$NOW" -ge "$END_HARD_EPOCH" ]; then
                echo "[SA_STATUS:WATCHDOG_TIMEOUT]"
                echo "[SA] Hard deadline (${HARD_TIMEOUT}s) reached. Stopping FFmpeg."
                if [ -f "$PID_FILE" ]; then
                  local P; P=$(cat "$PID_FILE" 2>/dev/null)
                  if [ -n "$P" ]; then
                    kill -TERM "$P" 2>/dev/null
                    sleep 8
                    kill -9 "$P" 2>/dev/null
                  fi
                fi
                return
              fi
              sleep 2
            done
          }

          # ---- Background monitor: UI markers + CPU/MEM health (no lookbehind) ----
          monitor_stream() {
            local CONNECTED=false LAST_FRAME=0 CHECK=0 VIDEO_PHASE=false
            while [ ! -f "$DONE_FILE" ]; do
              sleep 5
              CHECK=$(( CHECK + 1 ))
              [ -f "$FFMPEG_LOG" ] || continue
              if ! $CONNECTED; then
                if grep -qiE 'connection refused|connection timed out|no route to host|failed to connect|error opening|could not write header|handshake failed|403 forbidden|401 unauthorized|invalid stream key|netstream\.publish\.badname|netconnection\.connect\.rejected' "$FFMPEG_LOG" 2>/dev/null; then
                  FAIL_LINE=$(grep -iE 'connection refused|timed out|failed to connect|error opening|could not write|handshake|403|401|invalid stream key|badname|rejected' "$FFMPEG_LOG" | tail -1 | sed 's/^[[:space:]]*//' | cut -c1-140)
                  echo "[SA_STATUS:FAILED:${FAIL_LINE}]"
                  touch "$FAIL_FILE"
                  return
                fi
              fi
              if ! $CONNECTED; then
                if grep -qE 'Output #0|frame=[[:space:]]*[1-9]' "$FFMPEG_LOG" 2>/dev/null; then
                  CONNECTED=true
                  echo "[SA_STATUS:HANDSHAKE_OK]"
                  echo "[SA_STATUS:STREAMING]"
                  echo "[SA_STATUS:${ASSET_MODE_UPPER}]"
                  echo "[SA_STATUS:PHASE:${INITIAL_PHASE}]"
                fi
              fi
              if $CONNECTED && [ "$ASSET_MODE" = "photo_video" ] && ! $VIDEO_PHASE; then
                local NOW EL; NOW=$(date +%s); EL=$(( NOW - START_EPOCH ))
                if [ "$EL" -ge "$PHOTO_DUR" ]; then
                  VIDEO_PHASE=true
                  echo "[SA_STATUS:PHASE:VIDEO]"
                fi
              fi
              if $CONNECTED && [ $(( CHECK % 3 )) -eq 0 ]; then
                FRAME=$(grep -oE 'frame=[[:space:]]*[0-9]+' "$FFMPEG_LOG" | tail -1 | grep -oE '[0-9]+' | tail -1)
                if [ -n "$FRAME" ] && [ "$FRAME" != "$LAST_FRAME" ]; then
                  echo "[SA_STATUS:FRAME_COUNT:${FRAME}]"
                  LAST_FRAME="$FRAME"
                fi
              fi
              if [ $(( CHECK % 2 )) -eq 0 ] && [ -f "$PID_FILE" ]; then
                local P; P=$(cat "$PID_FILE" 2>/dev/null)
                if [ -n "$P" ] && kill -0 "$P" 2>/dev/null; then
                  STAT=$(ps -o %cpu=,%mem=,rss= -p "$P" 2>/dev/null | tr -s ' ' | sed 's/^ //')
                  [ -n "$STAT" ] && echo "[SA] FFmpeg pid ${P} health (cpu% mem% rssKB): ${STAT}"
                fi
              fi
            done
          }

          # ---- Launch supervisor: run mode, auto-restart on early drop ----
          deadline_killer & KILLER_PID=$!
          monitor_stream  & MONITOR_PID=$!

          ATTEMPT=0
          while :; do
            NOW=$(date +%s)
            REMAIN=$(( END_TARGET_EPOCH - NOW ))
            if [ "$REMAIN" -le 3 ]; then
              echo "[SA] Target duration reached (${TARGET_SECONDS}s)."
              break
            fi
            if [ -f "$FAIL_FILE" ]; then
              echo "[SA] Setup/connection failure detected - will not restart."
              FFMPEG_EXIT=1
              break
            fi
            STREAM_CUT="$REMAIN"
            ATTEMPT=$(( ATTEMPT + 1 ))
            if [ "$ATTEMPT" -eq 1 ]; then
              echo "[SA] Launch attempt #${ATTEMPT} (mode=${ASSET_MODE}, cut=${STREAM_CUT}s)."
              case "$ASSET_MODE" in
                photo_video) run_photo_video_mode ;;
                photo_only)  run_photo_only_mode  ;;
                video_only)  run_video_only_mode  ;;
                *)
                  echo "[SA_STATUS:FAILED:Unknown asset_mode: ${ASSET_MODE}]"
                  touch "$FAIL_FILE"; FFMPEG_EXIT=1; break
                  ;;
              esac
              FFMPEG_EXIT=$?
            else
              echo "[SA] FFmpeg dropped early - watchdog auto-restart #${ATTEMPT} (fill, remaining=${STREAM_CUT}s)."
              echo "[SA_STATUS:RECONNECTING]"
              run_fill_mode
              FFMPEG_EXIT=$?
            fi
            NOW=$(date +%s)
            if [ "$NOW" -ge $(( END_TARGET_EPOCH - 3 )) ]; then
              break
            fi
            if [ "$FFMPEG_EXIT" -eq 0 ]; then
              break
            fi
            echo "[SA] FFmpeg exit=${FFMPEG_EXIT} before target. Restarting in 2s..."
            sleep 2
          done

          touch "$DONE_FILE"
          kill "$MONITOR_PID" 2>/dev/null; wait "$MONITOR_PID" 2>/dev/null
          kill "$KILLER_PID"  2>/dev/null; wait "$KILLER_PID"  2>/dev/null

          echo ""
          if [ -f "$FAIL_FILE" ]; then
            echo "[SA] Session ended due to a setup/connection failure (see log below)."
          else
            echo "[SA] Streaming session completed for the full requested duration."
            echo "[SA_STATUS:COMPLETE]"
          fi

          echo "ffmpeg_exit_code=${FFMPEG_EXIT}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "--- FFmpeg stderr tail ---"
          tail -25 "$FFMPEG_LOG" 2>/dev/null || true
          echo "--- end stderr ---"
          echo ""
          exit 0


      # STEP 8 — Send RTMP end-of-stream signal (clean teardown)
      # ============================================================
      - name: "[8/8] Send RTMP end-of-stream signal (clean teardown)"
        if: always()
        shell: bash
        run: |
          RTMP_URL="${{ steps.params.outputs.rtmp_url }}"
          RTMP_BASE="${{ steps.params.outputs.rtmp_base }}"
          WIDTH="${{ steps.params.outputs.width }}"
          HEIGHT="${{ steps.params.outputs.height }}"

          echo ""
          echo "📡 [SA] ══════════════════════════════════════════════"
          echo "📡 [SA]  SENDING RTMP END-OF-STREAM SIGNAL"
          echo "📡 [SA] ══════════════════════════════════════════════"
          echo "📡 [SA]  Pushing 3-second pure-black clip."
          echo "📡 [SA]  This triggers RTMP deleteStream/FCUnpublish,"
          echo "📡 [SA]  forcing YouTube Studio offline IMMEDIATELY."
          echo "📡 [SA]  Target: ${RTMP_BASE}****"
          echo ""

          timeout --kill-after=15s 20s \
            ffmpeg \
              -hide_banner -y \
              -f lavfi -i "color=c=black:s=${WIDTH}x${HEIGHT}:r=30:d=3" \
              -f lavfi -i "anoisesrc=r=44100:amplitude=0.001:color=white" \
              -t 3 \
              -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -profile:v baseline -level:v 3.1 \
              -b:v 100k -pix_fmt yuv420p -r 30 -g 30 -keyint_min 30 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -f flv -flvflags no_duration_filesize \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              "${RTMP_URL}" \
            && echo "✅ [SA] End-of-stream signal delivered. YouTube Studio going offline." \
            || echo "⚠  [SA] End signal timed out (YouTube will self-timeout in ~30s)."

          echo ""
          echo "╔═══════════════════════════════════════════════════╗"
          echo "║       StreamAdda v9 — SESSION COMPLETE            ║"
          echo "╚═══════════════════════════════════════════════════╝"
          printf "  Stream Name  : %s\n" "${{ steps.params.outputs.stream_name }}"
          printf "  Platform     : %s\n" "${{ steps.params.outputs.platform_label }}"
          printf "  Asset Mode   : %s\n" "${{ steps.params.outputs.asset_mode }}"
          printf "  Ratio        : %s\n" "${{ steps.params.outputs.ratio }}"
          printf "  Duration     : %s min\n" "${{ steps.params.outputs.total_minutes }}"
          printf "  Drive Mode   : %s\n" "${{ steps.params.outputs.drive_mode }}"
          printf "  Ambient Audio: %s\n" "${{ steps.params.outputs.ambient_audio }}"
          printf "  FFmpeg Exit  : %s\n" "${{ steps.ffmpeg_stream.outputs.ffmpeg_exit_code }}"
          echo ""
          echo "  ✅ Stream session complete. Check YouTube Studio."
          echo ""
