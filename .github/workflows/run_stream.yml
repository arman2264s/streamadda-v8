name: "StreamAdda Ultimate Edition — GitHub Actions Streaming Engine"

# ==============================================================
#  StreamAdda Ultimate Edition — v9.1 (Engineering Patch)
#  Production-grade 24/7-style RTMP streaming engine.
#
#  Highlights:
#   - Python-built FFmpeg command (bullet-proof multi-photo slideshow)
#   - Natural road/street ASMR ambient audio engine (aevalsrc+anoisesrc+amix)
#   - [SA_TELEMETRY] live pipeline parsing (frame/fps/bitrate/speed/time)
#   - Zero-drift ISO-8601 scheduled start (absolute-epoch convergence loop)
#   - Dynamic photo/video split: photo = total - video (ffprobe)
#   - Watchdog auto-restart + hard deadline killer
#   - [SA_FFMPEG_RAW] raw FFmpeg stderr streamed to job log for UI terminal
#   - Graceful SIGINT -> SIGTERM termination trap (fixes Stop button bug)
#   - 10-second post-stop YouTube register wait before RTMP teardown
#
#  TRIGGERS
#   1. repository_dispatch -> fired by the frontend UI
#      event_type: "start-stream"
#   2. workflow_dispatch   -> manual run from the Actions tab
# ==============================================================
on:
  repository_dispatch:
    types: [start-stream]

  workflow_dispatch:
    inputs:
      stream_name:
        description: "Stream display name"
        required: false
        default: "Live Stream"
        type: string
      stream_key:
        description: "RTMP stream key (YouTube or Facebook)"
        required: true
        type: string
      platform:
        description: "Streaming platform"
        required: false
        default: "youtube"
        type: choice
        options: [youtube, facebook]
      ratio:
        description: "Video aspect ratio"
        required: false
        default: "9:16"
        type: choice
        options: ["9:16", "16:9"]
      total_minutes:
        description: "Total stream duration in minutes (max 345 enforced)"
        required: false
        default: "60"
        type: string
      asset_mode:
        description: "Asset mode: photo_video | photo_only | video_only"
        required: false
        default: "photo_video"
        type: choice
        options: [photo_video, photo_only, video_only]
      drive_mode:
        description: "Use Google Drive assets (true/false)"
        required: false
        default: "false"
        type: string
      photo_drive_url:
        description: "Google Drive URL for photo asset"
        required: false
        default: ""
        type: string
      video_drive_url:
        description: "Google Drive URL for video asset"
        required: false
        default: ""
        type: string
      photo_filename:
        description: "Photo filename(s) in repo root, comma-separated for slideshow"
        required: false
        default: "live_photo.jpg"
        type: string
      video_filename:
        description: "Video filename in repo root (local mode)"
        required: false
        default: "live_video.mp4"
        type: string
      ambient_audio:
        description: "Legacy: enable natural road/street ASMR audio (true/false). Superseded by noise_profile."
        required: false
        default: "false"
        type: string
      noise_profile:
        description: "Ambient noise filter profile (ignored if custom_audio_enabled=true)"
        required: false
        default: "road_asmr"
        type: choice
        options: [quiet, road_asmr, rain, cafe, forest, ocean, white_noise, pink_noise, brown_noise, wind, fireplace, office_hum]
      custom_audio_enabled:
        description: "Use custom uploaded audio track(s) instead of a noise profile (true/false)"
        required: false
        default: "false"
        type: string
      custom_audio_files:
        description: "Custom audio filename(s) in repository root, comma-separated (no rename needed). Looped for the whole stream."
        required: false
        default: ""
        type: string
      backup_rtmp:
        description: "Backup RTMP URL including key (optional)"
        required: false
        default: ""
        type: string
      youtube_video_id:
        description: "YouTube Video ID for Studio monitoring"
        required: false
        default: ""
        type: string
      start_at:
        description: "Scheduled start time (ISO 8601, e.g. 2026-06-01T14:30:00Z)"
        required: false
        default: ""
        type: string
      stop_at:
        description: "Hard stop time (ISO 8601, overrides duration if earlier)"
        required: false
        default: ""
        type: string


jobs:
  stream:
    name: "FFmpeg Ultimate Live Engine"
    runs-on: ubuntu-latest
    # GitHub force-kills any job at 360 min (6h). We clamp logic to 345 min
    # to guarantee ~15 min headroom for install + teardown.
    timeout-minutes: 360

    steps:

      # ============================================================
      # STEP 1 — Checkout repository
      # ============================================================
      - name: "[1/8] Checkout repository"
        uses: actions/checkout@v4


      # ============================================================
      # STEP 2 — Extract, sanitise, and validate ALL parameters
      #
      # INJECTION-SAFE ENV CAPTURE:
      #   The entire payload_config JSON is copied into RAW_PAYLOAD_JSON
      #   at the runner level (env:) BEFORE bash starts, so no shell
      #   metacharacter inside the JSON can ever corrupt the command line.
      # ============================================================
      - name: "[2/8] Extract and validate parameters"
        id: params
        env:
          RAW_PAYLOAD_JSON: ${{ github.event.client_payload.payload_config }}
        shell: bash
        run: |
          set -euo pipefail
          readonly ABSOLUTE_MAX_MINUTES=345

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ -z "$(printf '%s' "${RAW_PAYLOAD_JSON:-}" | tr -d '[:space:]')" ]; then
              echo "WARN [SA] payload_config empty. Using empty-object defaults." >&2
              RAW_PAYLOAD_JSON='{}'
            fi
            if ! printf '%s' "${RAW_PAYLOAD_JSON}" | jq empty >/dev/null 2>&1; then
              echo "[SA_STATUS:FAILED:payload_config is not valid JSON — cannot decode options.]" >&2
              echo "FATAL [SA] RAW_PAYLOAD_JSON failed jq validation." >&2
              exit 1
            fi
            pc() {
              local val
              val=$(printf '%s' "${RAW_PAYLOAD_JSON}" | jq -r --arg k "$1" '.[$k] // empty' 2>/dev/null)
              if [ -z "$val" ] && [ -n "${2:-}" ]; then echo "$2"; else echo "$val"; fi
            }
            RAW_KEY=$(pc stream_key)
            RAW_MINUTES=$(pc total_minutes "60")
            RAW_RATIO=$(pc ratio "9:16")
            RAW_PLATFORM=$(pc platform "youtube")
            RAW_ASSET_MODE=$(pc asset_mode "photo_video")
            RAW_DRIVE_MODE=$(pc drive_mode "false")
            RAW_PHOTO_FILE=$(pc photo_filename "live_photo.jpg")
            RAW_VIDEO_FILE=$(pc video_filename "live_video.mp4")
            RAW_PHOTO_DRIVE=$(pc photo_drive_url)
            RAW_VIDEO_DRIVE=$(pc video_drive_url)
            RAW_AMBIENT=$(pc ambient_audio "false")
            RAW_NOISE_PROFILE=$(pc noise_profile "road_asmr")
            RAW_CUSTOM_AUDIO_ENABLED=$(pc custom_audio_enabled "false")
            RAW_CUSTOM_AUDIO_FILES=$(pc custom_audio_files "")
            RAW_NAME=$(pc stream_name "Live Stream")
            RAW_BACKUP=$(pc backup_rtmp)
            RAW_YTID=$(pc youtube_video_id)
            RAW_START_AT=$(pc start_at)
            RAW_STOP_AT=$(pc stop_at)
            echo "OK [SA] Decoded payload_config bundle via jq."
          else
            RAW_NAME="${{ github.event.inputs.stream_name }}"
            RAW_KEY="${{ github.event.inputs.stream_key }}"
            RAW_RATIO="${{ github.event.inputs.ratio }}"
            RAW_MINUTES="${{ github.event.inputs.total_minutes }}"
            RAW_PLATFORM="${{ github.event.inputs.platform }}"
            RAW_ASSET_MODE="${{ github.event.inputs.asset_mode }}"
            RAW_DRIVE_MODE="${{ github.event.inputs.drive_mode }}"
            RAW_PHOTO_DRIVE="${{ github.event.inputs.photo_drive_url }}"
            RAW_VIDEO_DRIVE="${{ github.event.inputs.video_drive_url }}"
            RAW_PHOTO_FILE="${{ github.event.inputs.photo_filename }}"
            RAW_VIDEO_FILE="${{ github.event.inputs.video_filename }}"
            RAW_AMBIENT="${{ github.event.inputs.ambient_audio }}"
            RAW_NOISE_PROFILE="${{ github.event.inputs.noise_profile }}"
            RAW_CUSTOM_AUDIO_ENABLED="${{ github.event.inputs.custom_audio_enabled }}"
            RAW_CUSTOM_AUDIO_FILES="${{ github.event.inputs.custom_audio_files }}"
            RAW_BACKUP="${{ github.event.inputs.backup_rtmp }}"
            RAW_YTID="${{ github.event.inputs.youtube_video_id }}"
            RAW_START_AT="${{ github.event.inputs.start_at }}"
            RAW_STOP_AT="${{ github.event.inputs.stop_at }}"
          fi

          STREAM_NAME="${RAW_NAME:-Live Stream}"
          STREAM_KEY="${RAW_KEY:-}"
          RATIO="${RAW_RATIO:-9:16}"
          TOTAL_MINUTES="${RAW_MINUTES:-60}"
          PLATFORM="${RAW_PLATFORM:-youtube}"
          ASSET_MODE="${RAW_ASSET_MODE:-photo_video}"
          DRIVE_MODE="${RAW_DRIVE_MODE:-false}"
          PHOTO_DRIVE_URL="${RAW_PHOTO_DRIVE:-}"
          VIDEO_DRIVE_URL="${RAW_VIDEO_DRIVE:-}"
          PHOTO_FILENAME="${RAW_PHOTO_FILE:-live_photo.jpg}"
          VIDEO_FILENAME="${RAW_VIDEO_FILE:-live_video.mp4}"
          AMBIENT_AUDIO="${RAW_AMBIENT:-false}"
          NOISE_PROFILE="${RAW_NOISE_PROFILE:-road_asmr}"
          CUSTOM_AUDIO_ENABLED="${RAW_CUSTOM_AUDIO_ENABLED:-false}"
          CUSTOM_AUDIO_FILES="${RAW_CUSTOM_AUDIO_FILES:-}"
          BACKUP_RTMP="${RAW_BACKUP:-}"
          YOUTUBE_VIDEO_ID="${RAW_YTID:-}"
          START_AT="${RAW_START_AT:-}"
          STOP_AT="${RAW_STOP_AT:-}"

          if [ -z "$STREAM_KEY" ]; then
            echo "[SA_STATUS:FAILED:stream_key is empty. Supply the RTMP key from your platform.]" >&2
            exit 1
          fi
          if [ "$RATIO" != "16:9" ] && [ "$RATIO" != "9:16" ]; then
            echo "WARN [SA] Invalid ratio '${RATIO}'. Defaulting to 9:16."; RATIO="9:16"
          fi
          if ! echo "$TOTAL_MINUTES" | grep -qE '^[0-9]+$'; then
            echo "WARN [SA] Non-numeric total_minutes. Defaulting to 60."; TOTAL_MINUTES=60
          fi
          [ "$TOTAL_MINUTES" -lt 2 ] && TOTAL_MINUTES=2
          if [ "$TOTAL_MINUTES" -gt "$ABSOLUTE_MAX_MINUTES" ]; then
            echo "WARN [SA] total_minutes clamped to ${ABSOLUTE_MAX_MINUTES}."; TOTAL_MINUTES=$ABSOLUTE_MAX_MINUTES
          fi
          case "$ASSET_MODE" in
            photo_only|video_only|photo_video) ;;
            *) echo "WARN [SA] Unknown asset_mode. Defaulting to photo_video."; ASSET_MODE="photo_video" ;;
          esac
          case "$NOISE_PROFILE" in
            quiet|road_asmr|rain|cafe|forest|ocean|white_noise|pink_noise|brown_noise|wind|fireplace|office_hum) ;;
            *) echo "WARN [SA] Unknown noise_profile '${NOISE_PROFILE}'. Defaulting to road_asmr."; NOISE_PROFILE="road_asmr" ;;
          esac

          if [ "$PLATFORM" = "facebook" ]; then
            RTMP_BASE="rtmps://live-api-s.facebook.com:443/rtmp/"; PLATFORM_LABEL="Facebook Live"
          else
            PLATFORM="youtube"; RTMP_BASE="rtmps://a.rtmp.youtube.com/live2/"; PLATFORM_LABEL="YouTube Live"
          fi
          RTMP_URL="${RTMP_BASE}${STREAM_KEY}"

          if [ "$RATIO" = "16:9" ]; then WIDTH=1280; HEIGHT=720; else WIDTH=720; HEIGHT=1280; fi

          normalise_bool() { case "${1,,}" in true|1|yes|on) echo true;; *) echo false;; esac; }
          DRIVE_MODE=$(normalise_bool "$DRIVE_MODE")
          AMBIENT_AUDIO=$(normalise_bool "$AMBIENT_AUDIO")
          CUSTOM_AUDIO_ENABLED=$(normalise_bool "$CUSTOM_AUDIO_ENABLED")
          # Strip whitespace around each comma-separated audio filename
          CUSTOM_AUDIO_FILES=$(printf '%s' "$CUSTOM_AUDIO_FILES" | sed -E 's/[[:space:]]*,[[:space:]]*/,/g; s/^,+//; s/,+$//')
          if [ "$CUSTOM_AUDIO_ENABLED" = "true" ] && [ -z "$CUSTOM_AUDIO_FILES" ]; then
            echo "WARN [SA] custom_audio_enabled=true but no files supplied — falling back to noise_profile."
            CUSTOM_AUDIO_ENABLED="false"
          fi

          {
            echo "stream_name=${STREAM_NAME}"
            echo "stream_key=${STREAM_KEY}"
            echo "ratio=${RATIO}"
            echo "total_minutes=${TOTAL_MINUTES}"
            echo "platform=${PLATFORM}"
            echo "platform_label=${PLATFORM_LABEL}"
            echo "asset_mode=${ASSET_MODE}"
            echo "drive_mode=${DRIVE_MODE}"
            echo "photo_drive_url=${PHOTO_DRIVE_URL}"
            echo "video_drive_url=${VIDEO_DRIVE_URL}"
            echo "photo_filename=${PHOTO_FILENAME}"
            echo "video_filename=${VIDEO_FILENAME}"
            echo "ambient_audio=${AMBIENT_AUDIO}"
            echo "noise_profile=${NOISE_PROFILE}"
            echo "custom_audio_enabled=${CUSTOM_AUDIO_ENABLED}"
            echo "custom_audio_files=${CUSTOM_AUDIO_FILES}"
            echo "backup_rtmp=${BACKUP_RTMP}"
            echo "youtube_video_id=${YOUTUBE_VIDEO_ID}"
            echo "start_at=${START_AT}"
            echo "stop_at=${STOP_AT}"
            echo "rtmp_url=${RTMP_URL}"
            echo "rtmp_base=${RTMP_BASE}"
            echo "width=${WIDTH}"
            echo "height=${HEIGHT}"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "=================================================="
          echo "   StreamAdda Ultimate Edition — Engine Boot"
          echo "=================================================="
          printf "  Stream Name   : %s\n" "$STREAM_NAME"
          printf "  Platform      : %s\n" "$PLATFORM_LABEL"
          printf "  Ratio         : %s (%sx%s)\n" "$RATIO" "$WIDTH" "$HEIGHT"
          printf "  Duration      : %s min (cap 345)\n" "$TOTAL_MINUTES"
          printf "  Asset Mode    : %s\n" "$ASSET_MODE"
          printf "  Drive Mode    : %s\n" "$DRIVE_MODE"
          printf "  ASMR Ambient  : %s (legacy flag)\n" "$AMBIENT_AUDIO"
          printf "  Noise Profile : %s\n" "$NOISE_PROFILE"
          printf "  Custom Audio  : %s (%s)\n" "$CUSTOM_AUDIO_ENABLED" "${CUSTOM_AUDIO_FILES:-none}"
          printf "  Photo File(s) : %s\n" "$PHOTO_FILENAME"
          [ -n "$START_AT" ] && printf "  Sched. Start  : %s\n" "$START_AT" || printf "  Sched. Start  : Immediate\n"
          [ -n "$STOP_AT" ]  && printf "  Hard Stop At  : %s\n" "$STOP_AT"
          echo ""


      # ============================================================
      # STEP 3 — Install FFmpeg and required tooling
      # ============================================================
      - name: "[3/8] Install FFmpeg and system dependencies"
        shell: bash
        run: |
          set -euo pipefail
          echo "[SA] Updating apt package lists..."
          sudo apt-get update -qq
          echo "[SA] Installing FFmpeg, codecs, and tools..."
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-extra python3 python3-pip jq curl wget procps coreutils
          echo ""
          echo "[SA] FFmpeg installation complete."
          ffmpeg -version 2>&1 | head -3
          ffprobe -version 2>&1 | head -1
          echo "[SA] All codec libraries confirmed."


      # ============================================================
      # STEP 4 — Download or verify source media assets
      # ============================================================
      - name: "[4/8] Download or verify source media assets"
        id: assets
        shell: bash
        run: |
          set -uo pipefail
          ASSET_MODE="${{ steps.params.outputs.asset_mode }}"
          DRIVE_MODE="${{ steps.params.outputs.drive_mode }}"
          PHOTO_DRIVE_URL="${{ steps.params.outputs.photo_drive_url }}"
          VIDEO_DRIVE_URL="${{ steps.params.outputs.video_drive_url }}"
          PHOTO_FILENAME="${{ steps.params.outputs.photo_filename }}"
          VIDEO_FILENAME="${{ steps.params.outputs.video_filename }}"

          NEEDS_PHOTO=false; NEEDS_VIDEO=false
          case "$ASSET_MODE" in
            photo_only)  NEEDS_PHOTO=true ;;
            video_only)  NEEDS_VIDEO=true ;;
            photo_video) NEEDS_PHOTO=true; NEEDS_VIDEO=true ;;
          esac
          echo "[SA] mode=${ASSET_MODE} drive=${DRIVE_MODE} needsPhoto=${NEEDS_PHOTO} needsVideo=${NEEDS_VIDEO}"

          synth_photo() {
            echo "WARN [SA] Synthesising placeholder image -> live_photo.jpg"
            ffmpeg -hide_banner -y -f lavfi -i "color=c=0x0f172a:s=720x1280:d=1" -frames:v 1 live_photo.jpg >/dev/null 2>&1 || \
            ffmpeg -hide_banner -y -f lavfi -i "color=c=black:s=720x1280:d=1" -frames:v 1 live_photo.jpg >/dev/null 2>&1
          }
          synth_video() {
            echo "WARN [SA] Synthesising 5s placeholder clip -> live_video.mp4"
            ffmpeg -hide_banner -y \
              -f lavfi -i "color=c=black:s=720x1280:r=30:d=5" \
              -f lavfi -i "anoisesrc=r=44100:amplitude=0.001:color=white" \
              -shortest -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 live_video.mp4 >/dev/null 2>&1
          }

          download_from_drive() {
            local DRIVE_URL="$1" OUTPUT_PATH="$2" ASSET_LABEL="$3"
            echo "[SA] Downloading ${ASSET_LABEL} from Google Drive..."
            local FILE_ID
            FILE_ID=$(echo "$DRIVE_URL" | grep -oP '(?<=/d/)[^/?]+' | head -1)
            [ -z "$FILE_ID" ] && FILE_ID=$(echo "$DRIVE_URL" | grep -oP '(?<=id=)[^&]+' | head -1)
            if [ -z "$FILE_ID" ]; then echo "ERR [SA] Cannot extract Drive file ID." >&2; return 1; fi
            local COOKIE_JAR; COOKIE_JAR=$(mktemp /tmp/drive_cookies_XXXXXX)
            local CONFIRM_TOKEN
            CONFIRM_TOKEN=$(curl -sc "$COOKIE_JAR" -L \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" 2>/dev/null \
              | grep -oP '(?<=confirm=)[^&\"]+' | head -1)
            if [ -n "$CONFIRM_TOKEN" ]; then
              curl -Lb "$COOKIE_JAR" \
                "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=${CONFIRM_TOKEN}" \
                -o "${OUTPUT_PATH}.part" --progress-bar 2>&1
            else
              curl -L \
                "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&authuser=0" \
                -o "${OUTPUT_PATH}.part" --progress-bar 2>&1
            fi
            rm -f "$COOKIE_JAR"
            if [ ! -s "${OUTPUT_PATH}.part" ]; then echo "WARN [SA] Drive download empty." >&2; rm -f "${OUTPUT_PATH}.part"; return 1; fi
            mv -f "${OUTPUT_PATH}.part" "${OUTPUT_PATH}"
            echo "[SA] ${ASSET_LABEL} downloaded ($(du -sh "$OUTPUT_PATH" | awk '{print $1}'))."
          }

          # ---- Resolve photo list (comma-separated slideshow support) ----
          PHOTO_LIST=""
          if [ "$NEEDS_PHOTO" = "true" ]; then
            if [ "$DRIVE_MODE" = "true" ]; then
              if [ -z "$PHOTO_DRIVE_URL" ]; then echo "[SA_STATUS:FAILED:photo_drive_url missing for mode ${ASSET_MODE}]"; exit 1; fi
              download_from_drive "$PHOTO_DRIVE_URL" "live_photo.jpg" "PHOTO" || synth_photo
              file live_photo.jpg | grep -qiE 'image|jpeg|png|jpg' || synth_photo
              PHOTO_LIST="live_photo.jpg"
            else
              IFS=',' read -ra PARR <<< "$PHOTO_FILENAME"
              for raw in "${PARR[@]}"; do
                f="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                [ -z "$f" ] && continue
                if [ -f "$f" ] && [ -s "$f" ]; then
                  PHOTO_LIST="${PHOTO_LIST}${PHOTO_LIST:+,}${f}"
                  echo "[SA] Photo asset found: ${f} ($(du -sh "$f" | awk '{print $1}'))"
                else
                  echo "WARN [SA] Photo '${f}' not found in repo root — skipping."
                fi
              done
              if [ -z "$PHOTO_LIST" ]; then synth_photo; PHOTO_LIST="live_photo.jpg"; fi
            fi
          fi

          # ---- Resolve video ----
          if [ "$NEEDS_VIDEO" = "true" ]; then
            if [ "$DRIVE_MODE" = "true" ]; then
              if [ -z "$VIDEO_DRIVE_URL" ]; then echo "[SA_STATUS:FAILED:video_drive_url missing for mode ${ASSET_MODE}]"; exit 1; fi
              download_from_drive "$VIDEO_DRIVE_URL" "live_video.mp4" "VIDEO" || synth_video
            else
              if [ -f "$VIDEO_FILENAME" ] && [ -s "$VIDEO_FILENAME" ]; then
                [ "$VIDEO_FILENAME" != "live_video.mp4" ] && cp -f "$VIDEO_FILENAME" live_video.mp4
                echo "[SA] Video asset found: ${VIDEO_FILENAME} ($(du -sh live_video.mp4 | awk '{print $1}'))"
              else
                echo "[SA_STATUS:FAILED:Video file '${VIDEO_FILENAME}' not found in repository root]"
                exit 1
              fi
            fi
          fi

          echo "photo_list=${PHOTO_LIST}" >> "$GITHUB_OUTPUT"
          echo "[SA] Asset acquisition complete. photo_list=[${PHOTO_LIST}]"

          # ---- Verify custom audio track(s) — repo root, no rename needed ----
          CUSTOM_AUDIO_ENABLED="${{ steps.params.outputs.custom_audio_enabled }}"
          CUSTOM_AUDIO_FILES="${{ steps.params.outputs.custom_audio_files }}"
          VERIFIED_AUDIO=""
          if [ "$CUSTOM_AUDIO_ENABLED" = "true" ]; then
            IFS=',' read -ra AARR <<< "$CUSTOM_AUDIO_FILES"
            for raw in "${AARR[@]}"; do
              a="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [ -z "$a" ] && continue
              if [ -f "$a" ] && [ -s "$a" ]; then
                VERIFIED_AUDIO="${VERIFIED_AUDIO}${VERIFIED_AUDIO:+,}${a}"
                echo "[SA] Custom audio track found: ${a} ($(du -sh "$a" | awk '{print $1}'))"
              else
                echo "WARN [SA] Custom audio '${a}' not found in repo root — skipping."
              fi
            done
            if [ -z "$VERIFIED_AUDIO" ]; then
              echo "WARN [SA] No valid custom audio files — reverting to noise_profile for this run."
              CUSTOM_AUDIO_ENABLED="false"
            fi
          fi
          echo "custom_audio_enabled_verified=${CUSTOM_AUDIO_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "custom_audio_files_verified=${VERIFIED_AUDIO}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # STEP 5 — Probe media and compute the timing plan
      #   photo_dur = total_seconds - video_dur   (dynamic split)
      #   Uses ffprobe for accurate video duration detection.
      # ============================================================
      - name: "[5/8] Probe assets and calculate timing plan"
        id: timing
        shell: bash
        run: |
          set -uo pipefail
          ASSET_MODE="${{ steps.params.outputs.asset_mode }}"
          TOTAL_MINUTES="${{ steps.params.outputs.total_minutes }}"
          TOTAL_SECONDS=$(( TOTAL_MINUTES * 60 ))

          VIDEO_DUR_RAW="0"; VIDEO_DUR_INT=0; PHOTO_DUR=$TOTAL_SECONDS; HAS_AUDIO="false"

          if [ "$ASSET_MODE" = "photo_video" ] || [ "$ASSET_MODE" = "video_only" ]; then
            echo "[SA] Probing live_video.mp4 with ffprobe..."
            VIDEO_DUR_RAW=$(ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 live_video.mp4 2>/dev/null)
            if [ -z "$VIDEO_DUR_RAW" ] || [ "$VIDEO_DUR_RAW" = "N/A" ]; then
              echo "[SA_STATUS:FAILED:ffprobe failed — live_video.mp4 may be corrupt]"; exit 1
            fi
            HAS_AUDIO_RAW=$(ffprobe -v error -select_streams a \
              -show_entries stream=index -of csv=p=0 live_video.mp4 2>/dev/null)
            [ -n "$HAS_AUDIO_RAW" ] && HAS_AUDIO="true" || HAS_AUDIO="false"
            VIDEO_DUR_INT=$(python3 -c "print(int(float('${VIDEO_DUR_RAW}'.strip())))")
            echo "[SA] Video duration: ${VIDEO_DUR_INT}s | has_audio=${HAS_AUDIO}"
          fi

          if [ "$ASSET_MODE" = "photo_video" ]; then
            # KEY FORMULA: Photo Live Duration = Total Target Live Time - Video Duration
            PHOTO_DUR=$(( TOTAL_SECONDS - VIDEO_DUR_INT ))
            if [ "$PHOTO_DUR" -le 10 ]; then
              NEEDED_MIN=$(python3 -c "import math; print(math.ceil((${VIDEO_DUR_INT} + 11) / 60))")
              echo "[SA_STATUS:FAILED:video too long for chosen duration — increase total_minutes to ${NEEDED_MIN}]"; exit 1
            fi
          elif [ "$ASSET_MODE" = "photo_only" ]; then
            PHOTO_DUR=$TOTAL_SECONDS; VIDEO_DUR_INT=0
          else
            PHOTO_DUR=0
          fi

          echo ""
          echo "------------- TIMING PLAN -------------"
          printf "  Mode        : %s\n" "${ASSET_MODE}"
          printf "  Photo phase : %ss  [= Total(%ss) - Video(%ss)]\n" "${PHOTO_DUR}" "${TOTAL_SECONDS}" "${VIDEO_DUR_INT}"
          printf "  Video phase : %ss\n" "${VIDEO_DUR_INT}"
          printf "  Total       : %ss (%sm)\n" "${TOTAL_SECONDS}" "${TOTAL_MINUTES}"
          printf "  Video audio : %s\n" "${HAS_AUDIO}"
          echo "--------------------------------------"

          {
            echo "video_dur=${VIDEO_DUR_RAW}"
            echo "video_dur_int=${VIDEO_DUR_INT}"
            echo "photo_dur=${PHOTO_DUR}"
            echo "total_seconds=${TOTAL_SECONDS}"
            echo "has_audio=${HAS_AUDIO}"
          } >> "$GITHUB_OUTPUT"


      # ============================================================
      # STEP 6 — Zero-drift scheduled start
      #   Absolute-epoch convergence loop eliminates sleep drift.
      #   Supports local time input with UTC synchronization.
      # ============================================================
      - name: "[6/8] Handle scheduled start time (zero-drift UTC sync)"
        shell: bash
        run: |
          set -uo pipefail
          START_AT="${{ steps.params.outputs.start_at }}"
          if [ -z "$START_AT" ]; then echo "[SA] No schedule — launching immediately."; exit 0; fi
          echo "[SA] Scheduled start (ISO-8601 UTC): ${START_AT}"

          TARGET_EPOCH=$(START_AT="$START_AT" python3 - <<'PYEOF'
          import datetime, os, sys
          s = os.environ.get("START_AT", "").strip()
          try:
              if not s: print(0); sys.exit(0)
              if s.endswith('Z'): s = s[:-1] + '+00:00'
              t = datetime.datetime.fromisoformat(s)
              if t.tzinfo is None:
                  # Treat naive timestamps as UTC for zero-drift behaviour
                  t = t.replace(tzinfo=datetime.timezone.utc)
              print(int(t.timestamp()))
          except Exception as e:
              print(f"[SA][WARN] Could not parse start_at: {e}", file=sys.stderr); print(0)
          PYEOF
          )

          if [ "$TARGET_EPOCH" -le 0 ]; then echo "[SA] Invalid/immediate schedule — starting now."; exit 0; fi
          NOW=$(date +%s)
          MAX_WAIT=18000
          if [ "$(( TARGET_EPOCH - NOW ))" -gt "$MAX_WAIT" ]; then
            echo "WARN [SA] Wait exceeds 5h cap — capping schedule window."
            TARGET_EPOCH=$(( NOW + MAX_WAIT ))
          fi
          echo "[SA_STATUS:SCHEDULED]"
          while :; do
            NOW=$(date +%s)
            REMAIN=$(( TARGET_EPOCH - NOW ))
            [ "$REMAIN" -le 0 ] && break
            H=$(( REMAIN/3600 )); M=$(( (REMAIN%3600)/60 )); S=$(( REMAIN%60 ))
            printf "[SA] Waiting %02dh %02dm %02ds until scheduled start (UTC zero-drift)...\n" "$H" "$M" "$S"
            if   [ "$REMAIN" -gt 120 ]; then sleep 60
            elif [ "$REMAIN" -gt 10 ];  then sleep 5
            else sleep 1; fi
          done
          echo "[SA] Scheduled start reached (zero-drift UTC). Proceeding."


      # ============================================================
      # STEP 7 — CORE ENGINE: adaptive FFmpeg stream
      #
      #  A Python builder (build_ffmpeg.py) emits the exact FFmpeg argv
      #  as JSON for the requested mode + duration. This makes the
      #  multi-photo slideshow, ASMR audio, and photo/video concat
      #  fully deterministic and metacharacter-safe.
      #
      #  ASMR AMBIENT ENGINE (ambient_audio=true):
      #    engine rumble  : anoisesrc brown -> lowpass  (continuous)
      #    street air     : anoisesrc pink  -> band-pass hiss
      #    distant horns  : aevalsrc dual sine gated by a slow LFO
      #    -> amix (3 inputs) -> lowpass polish
      #  Quiet floor (ambient_audio=false): inaudible white noise.
      #
      #  RAW OUTPUT: FFmpeg stderr is piped through [SA_FFMPEG_RAW] prefix
      #  so the full unfiltered console output appears in the job log for
      #  the UI terminal display (frame/fps/bitrate/q/size/time/speed).
      #
      #  SIGINT/SIGTERM TRAP: Receiving a GitHub cancel signal sends
      #  kill -2 (SIGINT) then kill -15 (SIGTERM) to FFmpeg, enabling
      #  a clean GOP boundary stop before the RTMP teardown sequence.
      #
      #  TELEMETRY: monitor emits [SA_TELEMETRY] frame/fps/bitrate/speed/time.
      #  HANDSHAKE_OK is emitted only after real packet output is seen.
      # ============================================================
      - name: "[7/8] Launch adaptive FFmpeg stream"
        id: ffmpeg_stream
        shell: bash
        run: |
          set +e
          set +o pipefail

          RTMP_URL="${{ steps.params.outputs.rtmp_url }}"
          RTMP_BASE="${{ steps.params.outputs.rtmp_base }}"
          WIDTH="${{ steps.params.outputs.width }}"
          HEIGHT="${{ steps.params.outputs.height }}"
          RATIO="${{ steps.params.outputs.ratio }}"
          PLATFORM="${{ steps.params.outputs.platform }}"
          ASSET_MODE="${{ steps.params.outputs.asset_mode }}"
          AMBIENT_AUDIO="${{ steps.params.outputs.ambient_audio }}"
          NOISE_PROFILE="${{ steps.params.outputs.noise_profile }}"
          CUSTOM_AUDIO_ENABLED="${{ steps.assets.outputs.custom_audio_enabled_verified }}"
          CUSTOM_AUDIO_FILES="${{ steps.assets.outputs.custom_audio_files_verified }}"
          PHOTO_LIST="${{ steps.assets.outputs.photo_list }}"
          PHOTO_DUR="${{ steps.timing.outputs.photo_dur }}"
          VIDEO_DUR_INT="${{ steps.timing.outputs.video_dur_int }}"
          TOTAL_SECONDS="${{ steps.timing.outputs.total_seconds }}"
          HAS_AUDIO="${{ steps.timing.outputs.has_audio }}"
          STOP_AT="${{ steps.params.outputs.stop_at }}"
          export STOP_AT

          FFMPEG_LOG="/tmp/ffmpeg_stderr.log"
          PID_FILE="/tmp/ffmpeg_current.pid"
          DONE_FILE="/tmp/sa_done"; FAIL_FILE="/tmp/sa_fail"
          rm -f "$PID_FILE" "$DONE_FILE" "$FAIL_FILE"; : > "$FFMPEG_LOG"
          FFMPEG_EXIT=0
          ASSET_MODE_UPPER=$(printf '%s' "$ASSET_MODE" | tr '[:lower:]' '[:upper:]')
          [ "$ASSET_MODE" = "video_only" ] && INITIAL_PHASE="VIDEO" || INITIAL_PHASE="PHOTO"

          # Initialise PIDs for trap (referenced before background starts)
          MONITOR_PID=""
          KILLER_PID=""

          # ============================================================
          # SIGINT / SIGTERM GRACEFUL TERMINATION TRAP
          # Fixes: clicking "Stop" in the UI cancels the GH Actions run,
          # which sends SIGTERM to the runner shell. This trap then issues
          # kill -2 (SIGINT) -> kill -15 (SIGTERM) -> kill -9 to FFmpeg,
          # allowing it to flush the RTMP GOP boundary cleanly.
          # ============================================================
          _sa_graceful_stop() {
            echo ""
            echo "[SA] *** STOP SIGNAL RECEIVED — Graceful FFmpeg termination sequence ***"
            touch "$DONE_FILE"
            if [ -f "$PID_FILE" ]; then
              local FFPID; FFPID=$(cat "$PID_FILE" 2>/dev/null)
              if [ -n "$FFPID" ]; then
                echo "[SA] Phase 1: Sending SIGINT (kill -2) to FFmpeg PID ${FFPID}..."
                kill -2 "$FFPID" 2>/dev/null || true
                sleep 3
                echo "[SA] Phase 2: Sending SIGTERM (kill -15) to FFmpeg PID ${FFPID}..."
                kill -15 "$FFPID" 2>/dev/null || true
                sleep 2
                echo "[SA] Phase 3: SIGKILL cleanup for PID ${FFPID}..."
                kill -9 "$FFPID" 2>/dev/null || true
              fi
            fi
            [ -n "$MONITOR_PID" ] && { kill "$MONITOR_PID" 2>/dev/null; wait "$MONITOR_PID" 2>/dev/null || true; }
            [ -n "$KILLER_PID" ] && { kill "$KILLER_PID" 2>/dev/null; wait "$KILLER_PID" 2>/dev/null || true; }
            echo "[SA_STATUS:COMPLETE]"
            echo "[SA] FFmpeg stopped cleanly. RTMP teardown will follow in Step 8."
            echo "ffmpeg_exit_code=130" >> "$GITHUB_OUTPUT"
            exit 0
          }
          trap '_sa_graceful_stop' SIGINT SIGTERM HUP

          # ---------- Write the Python FFmpeg command builder ----------
          cat > /tmp/build_ffmpeg.py <<'PYEOF'
          import json, os, sys

          W       = os.environ["WIDTH"]
          H       = os.environ["HEIGHT"]
          MODE    = os.environ["ASSET_MODE"]
          AMBIENT = os.environ.get("AMBIENT_AUDIO", "false") == "true"
          HAS_AUD = os.environ.get("HAS_AUDIO", "false") == "true"
          PHOTOS  = [p.strip() for p in os.environ.get("PHOTO_LIST", "").split(",") if p.strip()]
          VIDEO   = "live_video.mp4"
          PHOTO_DUR = int(os.environ.get("PHOTO_DUR", "0") or 0)
          VIDEO_DUR = int(os.environ.get("VIDEO_DUR_INT", "0") or 0)
          TOTAL     = int(os.environ.get("TOTAL_SECONDS", "0") or 0)
          CUT       = int(os.environ.get("STREAM_CUT", "0") or 0)
          FILL      = os.environ.get("FILL", "false") == "true"
          RTMP      = os.environ["RTMP_URL"]

          QUIET = "anoisesrc=r=44100:amplitude=0.001:color=white"
          # Natural road/street ASMR bed: engine rumble + street air + gated distant horns.
          # Uses aevalsrc (sine LFO gated horns) + anoisesrc (brown rumble + pink air) + amix
          ASMR = (
              "anoisesrc=r=44100:c=brown:a=0.30,lowpass=f=150,volume=1.6[eng];"
              "anoisesrc=r=44100:c=pink:a=0.05,highpass=f=700,lowpass=f=5200,volume=0.5[air];"
              "aevalsrc='(0.10*sin(2*PI*277*t)+0.08*sin(2*PI*233*t))"
              "*max(0\\,sin(2*PI*0.028*t))':s=44100:c=stereo[horn];"
              "[eng][air][horn]amix=inputs=3:duration=longest:normalize=0,"
              "lowpass=f=6000,volume=1.3,"
              "aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
          )

          # ============================================================
          # NOISE_PROFILES — the full ambient/noise filter catalogue.
          # Each entry is a self-contained FFmpeg lavfi filtergraph string
          # (fed to `-f lavfi -i "<graph>"`) producing an infinite stereo
          # ambience bed. Mirrors the profile keys previewed client-side
          # in the UI (Web Audio API approximation) so what the user
          # auditions before selecting matches what actually airs.
          # ============================================================
          NOISE_PROFILES = {
              "quiet": QUIET,
              "road_asmr": ASMR,
              "rain": (
                  "anoisesrc=r=44100:c=white:a=0.35,highpass=f=900,lowpass=f=9000,volume=1.1[rn];"
                  "anoisesrc=r=44100:c=brown:a=0.06,lowpass=f=220,volume=0.6[rumble];"
                  "[rn][rumble]amix=inputs=2:duration=longest:normalize=0,"
                  "aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
              ),
              "cafe": (
                  "anoisesrc=r=44100:c=pink:a=0.14,bandpass=f=1400:width_type=h:w=2600,volume=1.0[chatter];"
                  "anoisesrc=r=44100:c=brown:a=0.05,lowpass=f=260,volume=0.5[room];"
                  "aevalsrc='0.05*sin(2*PI*1.2*t)*sin(2*PI*440*t)':s=44100:c=stereo[clink];"
                  "[chatter][room][clink]amix=inputs=3:duration=longest:normalize=0,"
                  "aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
              ),
              "forest": (
                  "anoisesrc=r=44100:c=green:a=0.10,bandpass=f=3200:width_type=h:w=3000,volume=1.0[wind_leaves];"
                  "aevalsrc='0.04*sin(2*PI*2600*t)*max(0\\,sin(2*PI*0.6*t))':s=44100:c=stereo[bird];"
                  "[wind_leaves][bird]amix=inputs=2:duration=longest:normalize=0,"
                  "aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
              ),
              "ocean": (
                  "anoisesrc=r=44100:c=white:a=0.30,lowpass=f=1800,volume=1.2[surf];"
                  "aevalsrc='0.15*sin(2*PI*0.09*t)':s=44100:c=stereo[swell];"
                  "[surf][swell]amix=inputs=2:duration=longest:weights='1 0.6':normalize=0,"
                  "lowpass=f=4000,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
              ),
              "white_noise": "anoisesrc=r=44100:c=white:a=0.20,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100",
              "pink_noise":  "anoisesrc=r=44100:c=pink:a=0.25,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100",
              "brown_noise": "anoisesrc=r=44100:c=brown:a=0.35,aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100",
              "wind": (
                  "anoisesrc=r=44100:c=white:a=0.22,bandpass=f=500:width_type=h:w=900,volume=1.3[gust];"
                  "aevalsrc='0.06*sin(2*PI*0.05*t)':s=44100:c=stereo[sway];"
                  "[gust][sway]amix=inputs=2:duration=longest:normalize=0,"
                  "aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
              ),
              "fireplace": (
                  "anoisesrc=r=44100:c=pink:a=0.10,highpass=f=1800,volume=0.9[crackle_bed];"
                  "aevalsrc='0.05*sin(2*PI*90*t)*max(0\\,sin(2*PI*3.1*t))':s=44100:c=stereo[pop];"
                  "[crackle_bed][pop]amix=inputs=2:duration=longest:normalize=0,"
                  "aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
              ),
              "office_hum": (
                  "aevalsrc='0.05*sin(2*PI*60*t)+0.02*sin(2*PI*120*t)':s=44100:c=stereo[hum];"
                  "anoisesrc=r=44100:c=white:a=0.015,volume=0.4[floor];"
                  "[hum][floor]amix=inputs=2:duration=longest:normalize=0,"
                  "aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100"
              ),
          }

          CUSTOM_AUDIO   = os.environ.get("CUSTOM_AUDIO_ENABLED", "false") == "true"
          AUDIO_FILES    = [a.strip() for a in os.environ.get("CUSTOM_AUDIO_FILES", "").split(",") if a.strip()]
          _profile_key   = os.environ.get("NOISE_PROFILE", "").strip()
          if _profile_key not in NOISE_PROFILES:
              # Legacy fallback: old ambient_audio boolean, or an unknown/blank profile key.
              _profile_key = "road_asmr" if AMBIENT else "quiet"
          NOISE_SRC = NOISE_PROFILES[_profile_key]
          AMBIENT_SRC = NOISE_SRC  # kept for readability at existing call sites below

          def next_audio_input(duration=None):
              """
              Append the currently selected ambience source as the next FFmpeg
              input (custom uploaded audio track(s) if enabled, else the chosen
              noise/ambience profile) and return its input stream index.

              Custom audio: single file -> `-stream_loop -1` on that file.
              Multiple files -> a generated ffconcat playlist, also looped
              forever with `-stream_loop -1`, so the whole track list repeats
              back-to-back for the entire stream duration.
              """
              global idx
              if CUSTOM_AUDIO and AUDIO_FILES:
                  if len(AUDIO_FILES) == 1:
                      pre = ["-stream_loop", "-1"]
                      if duration is not None:
                          pre += ["-t", str(duration)]
                      inputs.extend(pre + ["-re", "-i", AUDIO_FILES[0]])
                  else:
                      with open("/tmp/sa_audio_playlist.txt", "w") as fh:
                          for a in AUDIO_FILES:
                              safe = os.path.abspath(a).replace("'", "'\\''")
                              fh.write(f"file '{safe}'\n")
                      pre = ["-stream_loop", "-1", "-f", "concat", "-safe", "0"]
                      if duration is not None:
                          pre += ["-t", str(duration)]
                      inputs.extend(pre + ["-re", "-i", "/tmp/sa_audio_playlist.txt"])
              else:
                  pre = ["-f", "lavfi"]
                  if duration is not None:
                      pre += ["-t", str(duration)]
                  inputs.extend(pre + ["-i", NOISE_SRC])
              cur = idx
              idx += 1
              return cur

          def vscale(inp, out):
              return (f"[{inp}]scale={W}:{H}:force_original_aspect_ratio=decrease,"
                      f"pad={W}:{H}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=30,"
                      f"format=yuv420p[{out}]")

          def afmt(inp, out):
              return (f"[{inp}]aresample=async=1:first_pts=0,"
                      f"aformat=sample_fmts=fltp:channel_layouts=stereo:sample_rates=44100[{out}]")

          ENCODE = [
              "-t", str(CUT),
              "-c:v", "libx264", "-preset", "veryfast", "-tune", "zerolatency",
              "-profile:v", "main", "-level:v", "4.0",
              "-b:v", "2500k", "-minrate", "2500k", "-maxrate", "2500k", "-bufsize", "5000k",
              "-pix_fmt", "yuv420p", "-r", "30", "-g", "60", "-keyint_min", "60",
              "-sc_threshold", "0", "-x264opts", "no-scenecut",
              "-c:a", "aac", "-b:a", "128k", "-ar", "44100", "-ac", "2",
              "-max_muxing_queue_size", "1024", "-fflags", "+genpts",
              "-f", "flv", "-flvflags", "no_duration_filesize",
              "-rw_timeout", "15000000",
              "-reconnect", "1", "-reconnect_at_eof", "1",
              "-reconnect_streamed", "1", "-reconnect_delay_max", "5",
              RTMP,
          ]

          inputs, fc, idx = [], [], 0

          def add_photo_slideshow(seg_total, out_label):
              """Loop N photos as an even slideshow spanning seg_total seconds."""
              global idx
              n = max(1, len(PHOTOS))
              per = max(1, seg_total // n)
              vlabels = []
              for i, ph in enumerate(PHOTOS):
                  dur = per if i < n - 1 else max(1, seg_total - per * (n - 1))
                  inputs.extend(["-re", "-loop", "1", "-framerate", "30", "-t", str(dur), "-i", ph])
                  fc.append(vscale(f"{idx}:v", f"vph{i}"))
                  vlabels.append(f"[vph{i}]")
                  idx += 1
              if n == 1:
                  fc[-1] = vscale(f"{idx-1}:v", out_label)
              else:
                  fc.append("".join(vlabels) + f"concat=n={n}:v=1:a=0[{out_label}]")

          if FILL:
              # Watchdog fill: loop the primary asset to burn remaining time.
              if MODE == "photo_only" or (MODE == "photo_video"):
                  inputs.extend(["-re", "-loop", "1", "-framerate", "30", "-i", PHOTOS[0]])
                  fc.append(vscale("0:v", "vout")); idx += 1
                  ai = next_audio_input()
                  fc.append(afmt(f"{ai}:a", "aout"))
              else:
                  inputs.extend(["-stream_loop", "-1", "-re", "-i", VIDEO])
                  fc.append(vscale("0:v", "vout")); idx += 1
                  if HAS_AUD:
                      fc.append(afmt("0:a", "aout"))
                  else:
                      ai = next_audio_input(); fc.append(afmt(f"{ai}:a", "aout"))
              print(json.dumps(["-hide_banner", "-y"] + inputs +
                    ["-filter_complex", ";".join(fc), "-map", "[vout]", "-map", "[aout]"] + ENCODE))
              sys.exit(0)

          if MODE == "photo_only":
              add_photo_slideshow(TOTAL, "vout")
              ai = next_audio_input(TOTAL)
              fc.append(afmt(f"{ai}:a", "aout"))
              maps = ["-map", "[vout]", "-map", "[aout]"]

          elif MODE == "video_only":
              inputs.extend(["-stream_loop", "-1", "-re", "-i", VIDEO])
              fc.append(vscale("0:v", "vout")); idx += 1
              if HAS_AUD:
                  fc.append(afmt("0:a", "aout"))
              else:
                  ai = next_audio_input()
                  fc.append(afmt(f"{ai}:a", "aout"))
              maps = ["-map", "[vout]", "-map", "[aout]"]

          else:  # photo_video
              add_photo_slideshow(PHOTO_DUR, "vphoto")
              photo_audio_idx = next_audio_input(PHOTO_DUR)
              inputs.extend(["-re", "-i", VIDEO])
              video_idx = idx; idx += 1
              fc.append(vscale(f"{video_idx}:v", "vvid"))
              fc.append(afmt(f"{photo_audio_idx}:a", "aphoto"))
              if HAS_AUD:
                  fc.append(afmt(f"{video_idx}:a", "avid"))
              else:
                  # Video phase keeps its own ambience bed too (continuous loop
                  # across the whole broadcast, not just the photo phase).
                  avid_idx = next_audio_input(VIDEO_DUR)
                  fc.append(afmt(f"{avid_idx}:a", "avid"))
              fc.append("[vphoto][aphoto][vvid][avid]concat=n=2:v=1:a=1[vout][aout]")
              maps = ["-map", "[vout]", "-map", "[aout]"]

          print(json.dumps(["-hide_banner", "-y"] + inputs +
                ["-filter_complex", ";".join(fc)] + maps + ENCODE))
          PYEOF

          export WIDTH HEIGHT ASSET_MODE AMBIENT_AUDIO NOISE_PROFILE CUSTOM_AUDIO_ENABLED CUSTOM_AUDIO_FILES HAS_AUDIO PHOTO_LIST PHOTO_DUR VIDEO_DUR_INT TOTAL_SECONDS RTMP_URL

          # ============================================================
          # run_ffmpeg(): build args, create named pipe, stream raw stderr
          # to stdout as [SA_FFMPEG_RAW] lines (visible in job log for UI),
          # also write to FFMPEG_LOG for monitor_stream parsing.
          # ============================================================
          run_ffmpeg() {
            local FILL_FLAG="$1"
            local ARGS_JSON
            ARGS_JSON=$(STREAM_CUT="$STREAM_CUT" FILL="$FILL_FLAG" python3 /tmp/build_ffmpeg.py 2>/tmp/build_err.log)
            if [ -z "$ARGS_JSON" ]; then
              echo "[SA_STATUS:FAILED:FFmpeg command builder failed]"; cat /tmp/build_err.log >&2; touch "$FAIL_FILE"; return 1
            fi
            mapfile -t FF_ARGS < <(printf '%s' "$ARGS_JSON" | jq -r '.[]')

            # --- Named pipe: raw FFmpeg stderr -> [SA_FFMPEG_RAW] in job log ---
            local FFPIPE; FFPIPE=$(mktemp -u /tmp/ffpipe_XXXXXX)
            mkfifo "$FFPIPE"

            # Background reader: writes raw lines to FFMPEG_LOG AND emits
            # [SA_FFMPEG_RAW] prefix so the UI terminal can display them.
            while IFS= read -r rawline || [ -n "$rawline" ]; do
              printf '%s\n' "$rawline" >> "$FFMPEG_LOG"
              printf '[SA_FFMPEG_RAW] %s\n' "$rawline"
            done < "$FFPIPE" &
            local READER_PID=$!

            # Start FFmpeg — stderr to named pipe (raw output flows to reader)
            ffmpeg "${FF_ARGS[@]}" 2>"$FFPIPE" &
            local P=$!; echo "$P" > "$PID_FILE"
            wait "$P"; local EXIT=$?

            # Unblock the reader if FFmpeg closed the write end
            exec 3>"$FFPIPE" 3>&- 2>/dev/null || true
            wait "$READER_PID" 2>/dev/null || true
            rm -f "$FFPIPE"

            return $EXIT
          }

          # ---- Duration model (stop_at wins if earlier) ----
          TARGET_SECONDS="$TOTAL_SECONDS"
          if [ -n "$STOP_AT" ]; then
            STOP_SECS=$(python3 - <<'PYEOF'
          import datetime, os
          s = os.environ.get("STOP_AT", "").strip()
          try:
              if s.endswith("Z"): s = s[:-1] + "+00:00"
              t = datetime.datetime.fromisoformat(s)
              if t.tzinfo is None: t = t.replace(tzinfo=datetime.timezone.utc)
              print(max(0, int((t - datetime.datetime.now(datetime.timezone.utc)).total_seconds())))
          except Exception:
              print(-1)
          PYEOF
          )
            if [ "$STOP_SECS" -gt 0 ] && [ "$STOP_SECS" -lt "$TARGET_SECONDS" ]; then
              echo "[SA] stop_at deadline earlier: ${STOP_SECS}s."; TARGET_SECONDS="$STOP_SECS"
            fi
          fi
          HARD_TIMEOUT=$(( TARGET_SECONDS + 8 ))
          START_EPOCH=$(date +%s)
          END_TARGET_EPOCH=$(( START_EPOCH + TARGET_SECONDS ))
          END_HARD_EPOCH=$(( START_EPOCH + HARD_TIMEOUT ))

          echo ""
          echo "[SA] LAUNCHING ULTIMATE FFMPEG SESSION"
          printf "[SA]  Platform   : %s | %s | %sx%s\n" "$PLATFORM" "$RATIO" "$WIDTH" "$HEIGHT"
          printf "[SA]  Asset mode : %s\n" "$ASSET_MODE"
          printf "[SA]  Photo phase: %ss (%s image(s))\n" "$PHOTO_DUR" "$(echo "$PHOTO_LIST" | awk -F',' '{print NF}')"
          printf "[SA]  Video phase: %ss (audio: %s)\n" "$VIDEO_DUR_INT" "$HAS_AUDIO"
          printf "[SA]  Target dur : %ss (hard %ss)\n" "$TARGET_SECONDS" "$HARD_TIMEOUT"
          printf "[SA]  ASMR       : %s\n" "$AMBIENT_AUDIO"
          echo "[SA_STATUS:CONNECTING]"

          deadline_killer() {
            while [ ! -f "$DONE_FILE" ]; do
              local NOW; NOW=$(date +%s)
              if [ "$NOW" -ge "$END_HARD_EPOCH" ]; then
                echo "[SA_STATUS:WATCHDOG_TIMEOUT]"
                if [ -f "$PID_FILE" ]; then
                  local P; P=$(cat "$PID_FILE" 2>/dev/null)
                  [ -n "$P" ] && { kill -TERM "$P" 2>/dev/null; sleep 8; kill -9 "$P" 2>/dev/null; }
                fi
                return
              fi
              sleep 2
            done
          }

          monitor_stream() {
            local CONNECTED=false LAST_TELEM="" CHECK=0 VIDEO_PHASE=false
            while [ ! -f "$DONE_FILE" ]; do
              sleep 4; CHECK=$(( CHECK + 1 ))
              [ -f "$FFMPEG_LOG" ] || continue

              if ! $CONNECTED; then
                if grep -qiE 'connection refused|connection timed out|no route to host|failed to connect|error opening|could not write header|handshake failed|403 forbidden|401 unauthorized|invalid stream key|netstream\.publish\.badname|netconnection\.connect\.rejected' "$FFMPEG_LOG" 2>/dev/null; then
                  FAIL_LINE=$(grep -iE 'connection refused|timed out|failed to connect|error opening|could not write|handshake|403|401|invalid stream key|badname|rejected' "$FFMPEG_LOG" | tail -1 | sed 's/^[[:space:]]*//' | cut -c1-140)
                  echo "[SA_STATUS:FAILED:${FAIL_LINE}]"; touch "$FAIL_FILE"; return
                fi
                if grep -qE 'Output #0|frame=[[:space:]]*[1-9]' "$FFMPEG_LOG" 2>/dev/null; then
                  CONNECTED=true
                  echo "[SA_STATUS:HANDSHAKE_OK]"
                  echo "[SA_STATUS:STREAMING]"
                  echo "[SA_STATUS:${ASSET_MODE_UPPER}]"
                  echo "[SA_STATUS:PHASE:${INITIAL_PHASE}]"
                fi
              fi

              if $CONNECTED && [ "$ASSET_MODE" = "photo_video" ] && ! $VIDEO_PHASE; then
                local NOW EL; NOW=$(date +%s); EL=$(( NOW - START_EPOCH ))
                if [ "$EL" -ge "$PHOTO_DUR" ]; then VIDEO_PHASE=true; echo "[SA_STATUS:PHASE:VIDEO]"; fi
              fi

              # ---- LIVE TELEMETRY: parse frame/fps/bitrate/speed/time ----
              if $CONNECTED; then
                local LINE FR FPS BR SPD TM TELE
                LINE=$(tr '\r' '\n' < "$FFMPEG_LOG" | grep -E 'frame=' | tail -1)
                if [ -n "$LINE" ]; then
                  FR=$(echo "$LINE"  | grep -oE 'frame=[[:space:]]*[0-9]+'           | grep -oE '[0-9]+'        | tail -1)
                  FPS=$(echo "$LINE" | grep -oE 'fps=[[:space:]]*[0-9.]+'            | grep -oE '[0-9.]+'       | tail -1)
                  BR=$(echo "$LINE"  | grep -oE 'bitrate=[[:space:]]*[0-9.]+kbits/s' | grep -oE '[0-9.]+kbits/s' | tail -1)
                  SPD=$(echo "$LINE" | grep -oE 'speed=[[:space:]]*[0-9.]+x'         | grep -oE '[0-9.]+x'      | tail -1)
                  TM=$(echo "$LINE"  | grep -oE 'time=[0-9:.]+' | grep -oE '[0-9:.]+' | tail -1)
                  TELE="[SA_TELEMETRY] frame=${FR:-0} fps=${FPS:-0} bitrate=${BR:-0kbits/s} speed=${SPD:-0x} time=${TM:-00:00:00}"
                  if [ "$TELE" != "$LAST_TELEM" ]; then echo "$TELE"; LAST_TELEM="$TELE"; fi
                fi
              fi
            done
          }

          deadline_killer & KILLER_PID=$!
          monitor_stream  & MONITOR_PID=$!

          ATTEMPT=0
          while :; do
            NOW=$(date +%s); REMAIN=$(( END_TARGET_EPOCH - NOW ))
            [ "$REMAIN" -le 3 ] && { echo "[SA] Target duration reached (${TARGET_SECONDS}s)."; break; }
            [ -f "$FAIL_FILE" ] && { echo "[SA] Setup/connection failure — no restart."; FFMPEG_EXIT=1; break; }
            STREAM_CUT="$REMAIN"; ATTEMPT=$(( ATTEMPT + 1 ))
            if [ "$ATTEMPT" -eq 1 ]; then
              echo "[SA] Launch attempt #${ATTEMPT} (mode=${ASSET_MODE}, cut=${STREAM_CUT}s)."
              run_ffmpeg "false"; FFMPEG_EXIT=$?
            else
              echo "[SA] FFmpeg dropped early — watchdog auto-restart #${ATTEMPT} (fill, remaining=${STREAM_CUT}s)."
              echo "[SA_STATUS:RECONNECTING]"
              run_ffmpeg "true"; FFMPEG_EXIT=$?
            fi
            NOW=$(date +%s); [ "$NOW" -ge $(( END_TARGET_EPOCH - 3 )) ] && break
            [ "$FFMPEG_EXIT" -eq 0 ] && break
            echo "[SA] FFmpeg exit=${FFMPEG_EXIT} before target. Restarting in 2s..."; sleep 2
          done

          touch "$DONE_FILE"
          kill "$MONITOR_PID" 2>/dev/null; wait "$MONITOR_PID" 2>/dev/null
          kill "$KILLER_PID"  2>/dev/null; wait "$KILLER_PID"  2>/dev/null

          echo ""
          if [ -f "$FAIL_FILE" ]; then
            echo "[SA] Session ended due to a setup/connection failure."
          else
            echo "[SA] Streaming session completed for the full requested duration."
            echo "[SA_STATUS:COMPLETE]"
          fi
          echo "ffmpeg_exit_code=${FFMPEG_EXIT}" >> "$GITHUB_OUTPUT"

          echo ""; echo "--- FFmpeg stderr tail ---"; tail -25 "$FFMPEG_LOG" 2>/dev/null || true; echo "--- end ---"
          exit 0


      # ============================================================
      # STEP 8 — Clean RTMP teardown (force platform offline)
      #
      # BUG-FIX: waits exactly 10 seconds after FFmpeg stop to ensure
      # YouTube/Facebook registers the stream cutoff before sending the
      # black-frame end-of-stream RTMP signal. The UI Dismiss button
      # will be shown during this window.
      # ============================================================
      - name: "[8/8] Send RTMP end-of-stream signal"
        if: always()
        shell: bash
        run: |
          RTMP_URL="${{ steps.params.outputs.rtmp_url }}"
          RTMP_BASE="${{ steps.params.outputs.rtmp_base }}"
          WIDTH="${{ steps.params.outputs.width }}"
          HEIGHT="${{ steps.params.outputs.height }}"
          echo "[SA] *** 10-second YouTube registration window — waiting for platform to register stream cutoff ***"
          sleep 10
          echo "[SA] Proceeding with RTMP end-of-stream black-frame signal to ${RTMP_BASE}****"
          timeout --kill-after=15s 20s \
            ffmpeg -hide_banner -y \
              -f lavfi -i "color=c=black:s=${WIDTH}x${HEIGHT}:r=30:d=3" \
              -f lavfi -i "anoisesrc=r=44100:amplitude=0.001:color=white" \
              -t 3 -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level:v 3.1 \
              -b:v 100k -pix_fmt yuv420p -r 30 -g 30 -keyint_min 30 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -f flv -flvflags no_duration_filesize \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              "${RTMP_URL}" \
            && echo "[SA] End-of-stream signal delivered — broadcast status will show Ended." \
            || echo "WARN [SA] End signal timed out (platform self-timeout ~30s)."
          echo ""
          echo "=================================================="
          echo "   StreamAdda Ultimate Edition — SESSION COMPLETE"
          echo "=================================================="
          printf "  Stream Name  : %s\n" "${{ steps.params.outputs.stream_name }}"
          printf "  Platform     : %s\n" "${{ steps.params.outputs.platform_label }}"
          printf "  Asset Mode   : %s\n" "${{ steps.params.outputs.asset_mode }}"
          printf "  Ratio        : %s\n" "${{ steps.params.outputs.ratio }}"
          printf "  Duration     : %s min\n" "${{ steps.params.outputs.total_minutes }}"
          printf "  ASMR Ambient : %s\n" "${{ steps.params.outputs.ambient_audio }}"
          printf "  Noise Profile: %s\n" "${{ steps.params.outputs.noise_profile }}"
          printf "  Custom Audio : %s (%s)\n" "${{ steps.params.outputs.custom_audio_enabled }}" "${{ steps.params.outputs.custom_audio_files }}"
          printf "  FFmpeg Exit  : %s\n" "${{ steps.ffmpeg_stream.outputs.ffmpeg_exit_code }}"
          echo ""
